version: 2

models:
  - name: dq_source_profile
    description: >
      One row per source x column of the staged common-schema data: row count, null count and rate,
      distinct count, top 5 values and parse-failure rate (dob, postal_code). A NULL rate for consent
      columns means "not captured". Top values are suppressed for identifiers and quasi-identifiers.
    columns:
      - name: source_system
        data_tests: [not_null]
      - name: column_name
        data_tests: [not_null]

  - name: dq_defect_log
    description: >
      One row per flagged record per flag, with the raw value the rule fired on and a rule description.
      Also logs every INTL junk row (title, blank, header, summary) that staging dropped.
      `registration_key` is NULL for dropped junk rows, which are not registrations.
    columns:
      - name: source_system
        data_tests: [not_null]
      - name: flag
        data_tests: [not_null]
      - name: rule_description
        data_tests: [not_null]

  - name: dq_summary
    description: >
      One row per source x defect comparing observed vs configured defect rates. `status` is OK,
      OUT_OF_TOLERANCE, NOT_DETECTABLE_PHASE1 (observed NULL; needs Phase 2 identity matching or a
      second source) or NOT_CONFIGURED (a flag the pipeline raised that the config does not expect).
    columns:
      - name: source_system
        data_tests: [not_null]
      - name: defect_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [OK, OUT_OF_TOLERANCE, NOT_DETECTABLE_PHASE1, NOT_CONFIGURED]

  - name: dq_headcount_profile
    description: >
      Profile of the raw aggregate headcount source (Source E): per column rows, blanks, distinct values and top values, then the issue
      counters (total != girls + boys, round totals, missing grade band, double-reported program-years). Produced at the Profiling stage
      of the onboarding playbook.

  - name: dq_record_base
    description: >
      The one record-level stream the rule registry is evaluated against: every record of every source with the same small set of facts (NULL = not applicable). No rule logic lives here.
    config:
      tags: [phase5]
  - name: dq_org_season_base
    description: One row per known organization and season, reporting or not (from the organization registry); ORG_SEASON rules read this, since a dark organization has no records.
    config:
      tags: [phase5]
  - name: dq_rule_results
    description: >
      Long-form fact, one row per rule x grain key x purpose: observed pass rate, the registry threshold for that purpose and whether it passed. Contract rules are read from the contract
      validation, not re-measured.
    config:
      tags: [phase5]
  - name: dq_record_fitness
    description: One row per registration, fit_for_<purpose> and the registry rules it fails per purpose.
    config:
      tags: [phase5]
  - name: dq_count_fit_by_year
    description: DP1 aggregate port. Per season, distinct participants with at least one registration fit for the COUNT purpose. Counts only.
    config:
      tags: [phase5]
  - name: dq_geo_fit_person_year
    description: DP1 restricted port (consumer DP4). Per participant and season, registrations and registrations fit for GEO. Person key and counts only.
    config:
      tags: [phase5]
  - name: dq_missing_concentration
    description: DP1 aggregate port. Per season and KPI, counts of records with a missing value by organization and by division. Counts only.
    config:
      tags: [phase5]
  - name: dq_rule_measures
    description: "DP1 aggregate port. What DP1 measures without a resolved person, per rule and grain key: n_evaluated, n_pass, pass_rate. Counts only."
    config:
      tags: [phase5]
  - name: dq_identity_facts
    description: "DP2. The quality facts that need the resolved person (person_id, uniqueness, agreement across a person's records), keyed by record_key."
    config:
      tags: [phase5]
  - name: dq_record_resolved
    description: "DP2 restricted port (consumer DP4). dq_record_base with the resolved-person facts joined back; the same columns the single record stream had before the split."
    config:
      tags: [phase5]
  - name: dq_identity_rule_results
    description: "DP2 aggregate port. The rules that need the resolved person, evaluated and aggregated like dq_rule_measures. Counts only."
    config:
      tags: [phase5]
  - name: dq_scorecard_org
    description: >
      Organization x season x purpose x dimension scores (0 to 100) and grades. The PURPOSE_SCORE row is the minimum of the purpose's dimension scores (ADR-014); an organization-season
      below dq_n_min records carries a Wilson interval and is graded on its lower bound. A dark organization (no file) scores 0 on timeliness and therefore on every purpose.
    config:
      tags: [phase5]
  - name: dq_scorecard_source
    description: Source x season x purpose x dimension scores and grades, by the same method, pooled over the source's organizations; contract quality rules count in every season (includes_contract_rules says so).
    config:
      tags: [phase5]
  - name: dq_trend
    description: PURPOSE_SCORE over time for each source and organization with P-chart control limits (and mean +/- 3 sd from three prior seasons); out_of_control flags a shift against the entity's own history.
    config:
      tags: [phase5]
  - name: dq_standardized_records
    description: What every registration source looks like in the shape of the data standard (one column per standard field, grp_* grouping keys). A value a source cannot supply is NULL, never filled in.
    config:
      tags: [phase5]
  - name: dq_standard_conformance
    description: "Every source against the data standard, per organization, season and field: rows, missing, invalid and conformance. Measured by the validate_against_standard macro; INFO in the registry, never scored."
    config:
      tags: [phase5]
  - name: dq_standard_summary
    description: Per source and season, whether the source meets the data standard on the core (REQUIRED) and consent (CONDITIONAL) fields at the configured conformance, and which fields fail.
    config:
      tags: [phase5]
  - name: mart_dq_impact
    description: >
      What each rule costs, in the units a KPI is counted in: participants (and, for ACTIVATE on the modelled sources, households) that a rule's failures remove from a count, a segment, a place,
      a cohort or the contactable set, plus the uncertain identity merges it is entangled in. Rule x population x season x purpose, with the Pareto rank and cumulative share.
    config:
      tags: [phase5]
  - name: dq_fix_list
    description: >
      The top five issues for each organization and season, ranked by impact (mart_dq_impact) and phrased as an action (the registry's fix_guidance), with the records affected as a count only.
      A dark organization's top issue is that it sent no file, with the records it should have sent estimated from its other seasons.
    config:
      tags: [phase5]
    columns:
      - name: fix_guidance
        data_tests: [not_null]
  - name: mart_uncertainty_decomposition
    description: >
      Three separately labelled components of the uncertainty in the participant count per year: IDENTITY (Phase 3 bounds), DQ_EXCLUSIONS (strict vs lenient handling of records failing COUNT rules)
      and COVERAGE (participants of known organizations that sent no file, estimated from reporting peers). Shown side by side, never summed (ADR-015).
    config:
      tags: [phase5]
  - name: mart_missingness_tests
    description: Chi-square tests of whether a missing value (blank gender, no birth year) is associated with the organization channel, division, registration timing or country, per year; approximate p-values; flagged with a Bonferroni and a minimum-difference rule.
    config:
      tags: [phase5]
  - name: mart_missingness_bias
    description: >
      Per participant-level KPI with a missing input: the Phase 3 value, the known-only value, Manski-style bounds with no imputation, the missing share, where the missingness concentrates and whether it is
      associated with channel, division, timing or country (NOT_MISSING_AT_RANDOM). Girls' share of youth by year and division; age band mix by year.
    config:
      tags: [phase5]
  - name: mart_activation_funnel
    description: >
      The activation funnel per participation year and attributed market: registrations, resolved participants, households, households with a valid contact, with known consent provenance and consenting to
      CLUB_MARKETING. Counts only; each step carries loss_type DQ (the data cannot say), PRIVACY (the family said no or withdrew) or UNIT (children to households). market_id ALL is the national row.
    config:
      tags: [phase5]
  - name: mart_activation_funnel_loss
    description: Why households leave the activation funnel, by step, reason and type of loss (DQ or PRIVACY). A household appears once, at the first step it fails. Counts only.
    config:
      tags: [phase5]
  - name: int_participant_year_market
    description: RESTRICTED. Each participant-year placed in club markets with allocation weights that sum to 1 (ZIP3, OUTSIDE_US, UNPLACED_ALLOCATED_ORG or _STATE, UNALLOCATED). The basis column is carried everywhere so placed and allocated parts are never mixed silently.
    config:
      tags: [phase5]
  - name: int_dark_org_coverage
    description: For each known organization that sent no file in a season, the estimated unique participants (25th, 50th, 75th percentile of reporting peers of the same source, season, size band and region).
    config:
      tags: [phase5]
  - name: dq_market_rule_results
    description: The registry's record-level rules evaluated per club market with allocated (fractional) counts; contract and standard rules are not here.
    config:
      tags: [phase5]
  - name: dq_scorecard_market
    description: Club market x season x purpose x dimension scores and grades by the same method as the organization and source scorecards, on allocated counts. For the data steward; the club-facing aggregate is share_club.
    config:
      tags: [phase5]
  - name: mart_market_coverage
    description: >
      Per club market and year: allocated participants split by how they were placed, known versus reporting organizations, the coverage estimate for dark organizations, GEO fitness, purpose grades, and a
      participation rate only if population denominators are loaded ("denominator not loaded" otherwise). The club market is a project approximation, not any club's territory.
    config:
      tags: [phase5]

  - name: mart_reidentification_risk
    description: >
      Label-free. How identifying a participant-year dataset is when held at each minimization variant's granularity: equivalence classes over (year, DOB at the variant's precision, postal at the variant's
      precision, sex, country), the smallest class, the average class size, the share of rows that are unique and the share in a class below k_min. Direct identifiers are counted apart (contact_fields_held).
    config:
      tags: [phase5]
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: pct_rows_below_k_min
        data_tests: [not_null]

  - name: mart_minimization_fitness
    description: >
      Label-free. Share of registrations fit for each purpose under each minimization variant. Lost detection (a rule that can no longer be evaluated on coarsened data) can only raise fitness, which
      is why rules_no_longer_evaluable is carried beside it; a hashed email makes ACTIVATE fitness zero.
    config:
      tags: [phase5]
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
