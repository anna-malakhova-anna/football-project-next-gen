version: 2

# RESTRICTED schema `linkage`: this is where registration data meets the fan accounts (ADR-009). Nothing in it is shared as it stands: only the
# aggregated, suppressed models in share_exec / share_analyst may reach an audience (scripts/check_share_policy.py).
models:
  - name: int_household
    description: "Observed households: participants grouped by shared guardian contact (adults are households of one). Restricted."
    columns:
      - name: participant_id
        data_tests: [unique, not_null]
      - name: household_id
        data_tests: [not_null]
  - name: int_household_profile
    description: "One row per observed household with its contacts, country, years active and children. Restricted; contains contact values."
    columns:
      - name: household_id
        data_tests: [unique, not_null]
  - name: int_household_guarded_contacts
    description: "Counts of guardian contacts shared by more than six participants, which never form a household."
  - name: link_household_fan_account
    description: >
      Deterministic household -> fan account links (EMAIL, then PHONE for households and accounts with no email link). One to one; ambiguous candidates
      are listed but unused. Restricted.
    columns:
      - name: link_method
        data_tests:
          - accepted_values: {arguments: {values: [EMAIL, PHONE]}}
      - name: link_status
        data_tests:
          - accepted_values: {arguments: {values: [LINKED, AMBIGUOUS]}}
  - name: linkage_summary
    description: "Link rate and its make-up (counts only). Restricted."
  - name: linkage_link_bias
    description: "Linked vs unlinked households by country, years active, children and first year. Counts and shares only. Restricted."
  - name: fct_household_fan_status
    description: "One row per participant household: its fan status as of the month of its first registration. UNLINKED is unknown, not non-fan. Restricted."
    columns:
      - name: household_id
        data_tests: [unique, not_null]
      - name: fan_status
        data_tests:
          - accepted_values: {arguments: {values: [UNLINKED, NET_NEW, EXISTING_ACTIVE, EXISTING_COOLING, LAPSED_REACTIVATED, LAPSED_DORMANT, INSUFFICIENT_HISTORY]}}
  - name: int_household_funnel_base
    description: "One row per participant household with every funnel stage worked out as of the end of its registration cohort year. Restricted."
    columns:
      - name: household_id
        data_tests: [unique, not_null]
  - name: mart_fan_funnel
    description: >
      The fan acquisition funnel (participant households, linked, contactable, active, monetized, retained) by registration cohort year, market type, segment and fan status. Stages are cumulative;
      UNLINKED is its own line. Counts and rates only. Restricted.
  - name: mart_acquisition_summary
    description: "Incremental new fan accounts the programme added (market-level estimate with a range) beside the naive count of every account created after a registration. Counts only. Restricted."
  - name: int_fan_account_group
    description: "Which kind of fan each canonical fan account is (net-new via the flag prompt, other net-new, existing fan, unlinked or non-participant) and where its survival spell starts. Restricted."
    columns:
      - name: fan_account_id
        data_tests: [unique, not_null]
  - name: int_fan_lapse_spells
    description: "One spell per account in a survival group: months from the origin to the first lapse (6 quiet months), censored at the end of the data. Restricted."
  - name: mart_fan_survival
    description: "Kaplan-Meier survival of fan activeness (time to first lapse) by fan group and market type, with Greenwood intervals. Counts only. Restricted."
  - name: mart_fan_ltv
    description: "SYNTHETIC illustrative 36-month fan value: net spend per active month x expected active months (area under the fan-survival curve), with a range from the survival interval."
  - name: mart_fan_activeness
    description: "Fan accounts active, at risk, lapsed or new at each month end, and the transitions between those states, by fan group. Counts only. Restricted."
  - name: int_fan_rfm_scores
    description: "Account-level RFM quintile scores at each year end (trailing 12 months). Never shared. Restricted."
  - name: mart_fan_rfm
    description: "RFM segment mix by year and fan group (Champions, Loyal, Promising, At risk, Hibernating). Counts and shares. Restricted."
  - name: mart_fan_lapse_after_child_churn
    description: "ASSOCIATION ONLY: the fan lapse rate while a child plays against after the child stops, with person-time split at the churn month. Restricted."
  - name: mart_fan_value_uplift
    description: "Matched difference-in-differences among existing and lapsed fans by engagement type and spend category (net of refunds, synthetic currency), with the naive unmatched comparison. Restricted."
