version: 2

# Phase 6 (ADR-022): the age-tier and guardian-consent layer for G3. Participant- and household-keyed models live in the restricted schema phase6_restricted; only counts leave it.

models:
  - name: int_participant_age_tier
    description: >
      RESTRICTED. Participant x participation year: age tier (U13, 13_15, 16_17, ADULT, UNKNOWN) from the Dec 31 age convention (ADR-002), and the age-rule jurisdiction from the participant's country and region.
    columns:
      - {name: participant_id, data_tests: [not_null]}
      - {name: participation_year, data_tests: [not_null]}
      - name: age_tier
        data_tests:
          - accepted_values: {arguments: {values: [U13, '13_15', '16_17', ADULT, UNKNOWN]}}
      - {name: jurisdiction, data_tests: [not_null]}

  - name: int_consent_permissions
    description: >
      RESTRICTED. Household (guardian side) x purpose as of the household's last participation year: is the contact permitted, and why. The most restrictive child governs. Keyed by household only; no participant column.
      Permitted is Y only when the rules allow the purpose and it is covered (league operations by the registration; every other purpose by a guardian consent with full provenance). A blank is never a yes.
    columns:
      - {name: household_id, data_tests: [not_null]}
      - name: permitted
        data_tests:
          - accepted_values: {arguments: {values: ['Y', 'N']}}
      - name: consent_status
        data_tests:
          - accepted_values: {arguments: {values: [GRANTED_FULL, GRANTED_INCOMPLETE, DECLINED, REVOKED, NOT_CAPTURED]}}
      - name: basis
        data_tests:
          - accepted_values: {arguments: {values: [REGISTRATION, GUARDIAN_CONSENT, NONE]}}

  - name: mart_conversion_funnel_by_tier
    description: >
      DP5. Households by the age tier of the youngest child: registered, linked to a fan account, engaged, purchased (analytics only) and consented to club marketing (activation). Counts only; a step is hidden
      when it or the step it follows is below k_min.
    columns:
      - name: age_tier
        data_tests:
          - accepted_values: {arguments: {values: [U13, '13_15', '16_17', ADULT, UNKNOWN]}}
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: [ANALYTICS_ONLY, ACTIVATION]}}
      - name: suppressed
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: int_age_out_carryover_check
    description: >
      RESTRICTED. One row per participant who was a minor, appears as an adult later, and sits in a household with children that is linked to a fan account: a youth-to-adult carry-over that fresh consent at 18
      forbids. Required to be empty (test a_participant_turning_18_carries_no_fan_link); the unit test age_out_carryover_is_caught gives it a violating participant.

unit_tests:
  # Hand-built participants. P1 ages out of a household that has a fan link: the violation. P2 is the same but its household is adult-only. P3 stays a minor. P4 was never a minor. P5 ages out but has no link.
  - name: age_out_carryover_is_caught
    model: int_age_out_carryover_check
    given:
      - input: ref('int_participant_age_tier')
        rows:
          - {participant_id: P1, participation_year: 2022, age_tier: '13_15'}
          - {participant_id: P1, participation_year: 2024, age_tier: ADULT}
          - {participant_id: P2, participation_year: 2022, age_tier: '16_17'}
          - {participant_id: P2, participation_year: 2025, age_tier: ADULT}
          - {participant_id: P3, participation_year: 2022, age_tier: U13}
          - {participant_id: P3, participation_year: 2024, age_tier: U13}
          - {participant_id: P4, participation_year: 2024, age_tier: ADULT}
          - {participant_id: P5, participation_year: 2022, age_tier: '16_17'}
          - {participant_id: P5, participation_year: 2024, age_tier: ADULT}
      - input: ref('int_household')
        rows:
          - {participant_id: P1, household_id: H1, is_adult_household: false}
          - {participant_id: P2, household_id: H2, is_adult_household: true}
          - {participant_id: P3, household_id: H3, is_adult_household: false}
          - {participant_id: P4, household_id: H4, is_adult_household: true}
          - {participant_id: P5, household_id: H5, is_adult_household: false}
      - input: ref('link_household_fan_account')
        rows:
          - {household_id: H1, account_id: A1}
          - {household_id: H2, account_id: A2}
          - {household_id: H3, account_id: A3}
          - {household_id: H4, account_id: A4}
    expect:
      rows:
        - {participant_id: P1, household_id: H1, first_minor_year: 2022, first_adult_year: 2024}
