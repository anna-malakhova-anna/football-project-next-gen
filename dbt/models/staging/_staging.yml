version: 2

models:
  - name: stg_us_registrations
    description: >
      One row per raw US league CSV row (1:1 with raw grain). Typed and standardized; bad records are
      flagged, never dropped. Exact double-submit copies are kept and flagged `is_exact_duplicate`;
      `record_occurrence` numbers repeats of the same `source_record_id`.
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: source_system
        data_tests:
          - accepted_values: {arguments: {values: [US_LEAGUE]}}

  - name: stg_ca_registrations
    description: >
      One row per raw Canadian club API record (1:1 with raw grain), JSON flattened. Birth year only
      (`dob` is NULL, `dob_precision` = YEAR). `registered_at` is the consent capture time, NULL when
      the `consents` object is missing. Pagination-overlap repeats are kept and flagged.
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: source_system
        data_tests:
          - accepted_values: {arguments: {values: [CA_CLUB]}}

  - name: stg_intl_registrations
    description: >
      One row per real player row in the federation workbooks. Title, blank, header and summary rows
      are dropped here (and logged in dq_defect_log). Excel serial dates are decoded; Full Name is split
      into given/family (family-name-first sheets configured in `intl_family_name_first_countries`).
      `consent_marketing` is always NULL: this source does not capture it.
    columns:
      - name: source_record_id
        data_tests: [not_null, unique]
      - name: source_system
        data_tests:
          - accepted_values: {arguments: {values: [INTL_FED]}}

  - name: stg_school_headcounts
    description: >
      One row per raw school / recreation program CSV row (1:1 with raw grain). AGGREGATE-ONLY: no person, no contact details, no consent.
      Typed and standardized; bad rows are flagged, never dropped. A program-year reported twice keeps the latest report
      (`is_superseded` marks the other); `headcount` is girls + boys when the stated total disagrees with it. Facts built from this model
      must not be joined to participants (enforced by scripts/check_lineage.py).
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: source_system
        data_tests:
          - accepted_values: {arguments: {values: [SCHOOL_AGGREGATES]}}
      - name: headcount
        data_tests: [not_null]
      - name: program_type
        data_tests: [not_null]
      - name: country_code
        data_tests: [not_null]

  - name: stg_fan_consent_events
    description: >
      One row per raw consent line (1:1 with raw grain). No row for a channel never answered: not captured, never FALSE. Preference-centre opt-outs with no earlier opt-in are flagged
      consent_out_of_order (resolved by timestamp downstream).
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [opt_in, opt_out]}}

  - name: stg_fan_transactions
    description: >
      One row per raw transaction line (1:1 with raw grain), synthetic currency. Duplicates, orphan refunds, unknown accounts and bad categories or amounts are flagged, never dropped or repaired.
    columns:
      - name: txn_id
        data_tests: [not_null]
      - name: category
        data_tests:
          - accepted_values: {arguments: {values: [ticket, merch, subscription, other]}}
