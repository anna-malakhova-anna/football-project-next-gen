version: 2

sources:
  - name: ground_truth
    description: >
      The generator's answer key (SYNTHETIC data), loaded into schema `eval` by `make load-eval`. Only models
      under models/evaluation/ may reference this source; scripts/check_eval_isolation.py fails the build
      otherwise. The matcher (models/identity, models/marts) never sees it.
    schema: eval
    tables:
      - name: person_registry
        description: One row per true person, with the hidden true_person_id, household and twin group.
      - name: registration_truth
        description: Every source record id mapped to its true_person_id.
      - name: defect_manifest
        description: Every injected defect by source record id.
      - name: school_truth
        description: One row per true program x year (Source E), with the true total, girls, boys and how many registered participants sit in it.
      - name: school_overlap_truth
        description: Which true persons sit in which program-year (Source E). The source file never carries this.
      - name: churn_truth
        description: The true per-season churn probability by age band, and the youth maximum age (the answer key for the retention curves).
      - name: fan_truth
        description: One row per household (participant or non-participant fan household), with latent fandom, enrollment propensity, enrollment month and the true uplift (Source D).
      - name: fan_account_truth
        description: Each fan account mapped to its true household, with flags for a different registration email and a shared phone number.
      - name: fan_market_truth
        description: Per market and year, the new accounts and how many of them the programme caused (the answer key for acquisition incrementality).
      - name: fan_consent_truth
        description: Each account's intended final consent status per channel (the answer key for the consent history).
      - name: fan_effect_truth
        description: Per participant account and month, the expected events as observed (with the uplift and any reactivation) and with no programme (the oracle behind the fandom estimate).
      - name: p5_registration_truth
        description: Phase 5. Every feed record (six US registration feeds) mapped to its true person, household, canonical league and season; tackle rows are marked is_flag = false.
      - name: p5_defect_manifest
        description: Phase 5. Every injected defect by feed record.
      - name: org_quality_truth
        description: "Phase 5. Each organization's latent data-quality profile (DISCIPLINED, TYPICAL, STRUGGLING, MANUAL) and form properties (ZIP optional, DOB division-only, consent wording). The answer key for the scorecards."
      - name: unreported_participation_truth
        description: "Phase 5. Participants whose organization sent no file in a season: they exist here and in no source (the answer key for coverage)."
      - name: minimization_runs
        description: >
          One row per minimization variant and matcher: the identity-resolution accuracy measured against the answer key with that variant applied to the matcher's input. Written by
          scripts/p5_minimization_runs.py (make minimize), not by the generator; may be missing until that has run, which eval_minimization_tradeoff tolerates.
      - name: gmp_market_truth
        description: >
          Phase 7 answer key (ADR-025): true participants and true direction per season for the 15 program markets with no participation source, and
          whether the latest direction was set against the comparables (an assumption). Written by generator/phase7/gmp.py (make p7-data).
