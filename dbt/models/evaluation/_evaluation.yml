version: 2

models:
  - name: eval_truth_pairs
    description: >
      GROUND TRUTH. Every true matching pair among the matcher's input records (the recall denominator).
      Only models in models/evaluation/ may read ground truth.
    columns:
      - name: record_a
        data_tests: [not_null]
      - name: record_b
        data_tests: [not_null]

  - name: eval_blocking
    description: >
      GROUND TRUTH. Blocking quality: pair completeness, reduction ratio, completeness by block, unique
      contribution of each block and the largest block keys.

  - name: eval_record_truth
    description: GROUND TRUTH. The true person, household and twin group behind each matcher input record.
    columns:
      - name: match_record_id
        data_tests: [unique, not_null]

  - name: eval_pairwise
    description: >
      GROUND TRUTH. Pairwise precision, recall and F1 for each matcher, review stage and scope, computed on final
      clusters (so transitive errors count). recall_nondeterministic excludes pairs that source ids already link.

  - name: eval_clusters
    description: >
      GROUND TRUTH. Cluster quality per matcher, stage and scope: split rate, merge rate, sibling/twin false merges
      (headline metric) and predicted vs true participant counts.

  - name: eval_threshold_sweep
    description: >
      GROUND TRUTH. Precision, recall, false merges and review-queue size for the Fellegi-Sunter matchers at 20
      probability thresholds between 0.50 and 0.999. Justifies T_auto and T_review.
    columns:
      - name: threshold
        data_tests: [not_null]

  - name: eval_segments
    description: >
      GROUND TRUTH. Pairwise recall by source pair, by injected defect type and by situation (near-duplicate,
      multi-league same season), plus precision by source pair, per matcher, stage and scope.

  - name: eval_errors
    description: >
      GROUND TRUTH. Every false positive and false negative pair at the AUTO scope (first 200 of each kind per matcher
      and stage) with a SQL-assigned likely_cause. Feeds the error analysis.
    columns:
      - name: likely_cause
        data_tests:
          - accepted_values:
              arguments:
                values: [TWIN, SIBLING, TRANSITIVE_CHAIN, NAME_CHANGE, BLOCKING_MISS, GUARD_OVERRIDE, BELOW_THRESHOLD, OTHER]

  - name: eval_participation_accuracy
    description: >
      GROUND TRUTH. Per year and attributed country: true participant count vs the label-free identity bounds (low,
      point, high), whether truth falls inside the range, the point error, and true vs predicted multi-country and
      multi-org counts. The only Phase 3 model that reads ground truth.
    columns:
      - name: truth_within_range
        data_tests: [not_null]

  - name: eval_headcount_overlap
    description: >
      GROUND TRUTH (evaluation only, synthetic). Per year: reported vs true program headcount, the true overlap with registered participants
      against the bound used by the combined-reach range, whether the true combined reach fell inside [low, high], and the error of the naive
      participants + headcount sum.
    columns:
      - name: participation_year
        data_tests: [unique, not_null]
      - name: overlap_within_bound
        data_tests: [accepted_values: {arguments: {values: [true]}}]
      - name: truth_inside_range
        data_tests: [accepted_values: {arguments: {values: [true]}}]

  - name: eval_retention
    description: >
      GROUND TRUTH (evaluation only, synthetic). Kaplan-Meier curves against the true churn parameters, and the naive age-out-as-churn version beside them.
    columns:
      - name: km_survival
        data_tests: [not_null]
      - name: true_survival
        data_tests: [not_null]


  - name: eval_retention_checks
    description: >
      GROUND TRUTH (evaluation only). Pass/fail checks on eval_retention: the KM curve is inside its interval, interval coverage is honest, and the naive
      age-out-as-churn version understates retention for the oldest youth entrants.
    columns:
      - name: passed
        data_tests:
          # a warning, not a failure: on the clean (no stale pages) data the retention interval covered the truth in 83.9% of reliable steps against a 85% target. Reported, not tuned.
          - accepted_values: {arguments: {values: [true]}, config: {severity: warn}}

  - name: eval_fan_effect
    description: >
      GROUND TRUTH (evaluation only, synthetic). The naive and matched difference-in-differences estimates of the fandom uplift against the true uplift.
  - name: eval_fan_matching_diagnostics
    description: >
      GROUND TRUTH (evaluation only, synthetic). Comparison-group contamination, selection on latent fandom before and after matching, and the pre-trend.

  - name: eval_fan_checks
    description: >
      GROUND TRUTH (evaluation only). Pass/fail: naive is inflated, matched is much closer, the pre-trend is small.
    columns:
      - name: passed
        data_tests:
          - accepted_values: {arguments: {values: [true]}}

  - name: eval_acquisition
    description: "GROUND TRUTH (evaluation only, synthetic). Acquisition incrementality: the market-level estimate and the naive counts against the accounts the programme actually caused."
  - name: eval_acquisition_event_study
    description: "GROUND TRUTH (evaluation only, synthetic). The acquisition event study against the true effect by year since launch."

  - name: eval_acquisition_checks
    description: "GROUND TRUTH (evaluation only). Pass/fail: the truth lies inside the estimate's range, the pre-period is flat, and the scaled naive claim overclaims."
    columns:
      - name: passed
        data_tests:
          - accepted_values: {arguments: {values: [true]}}

  - name: eval_fan_value_uplift
    description: "GROUND TRUTH (evaluation only, synthetic). The value-uplift estimates against the generator's exact expected effect, by status group, engagement type and spend category."
  - name: eval_fan_lapse_after_child_churn
    description: "GROUND TRUTH (evaluation only, synthetic). The measured fan-lapse rate ratio after a child stops playing against the hazard multiplier the generator applied."

  - name: eval_fan_value_checks
    description: "GROUND TRUTH (evaluation only). Pass/fail: the value-uplift per-month estimates cover their truth for existing and lapsed fans, and the lapse rate rises after the child stops."
    columns:
      - name: passed
        data_tests:
          - accepted_values: {arguments: {values: [true]}}

  - name: eval_consent_history
    description: "GROUND TRUTH (evaluation only, synthetic). The resolved consent history against each account's intended final consent, with the mismatches that the out-of-order flag makes visible."
  - name: eval_consent_checks
    description: "GROUND TRUTH (evaluation only). Pass/fail: nearly every consent mismatch carries the out-of-order flag (a small unflagged residue is reported), and the mismatch rate is small."
    columns:
      - name: passed
        data_tests:
          - accepted_values: {arguments: {values: [true]}}

  - name: eval_minimization_tradeoff
    description: >
      GROUND TRUTH (evaluation only, synthetic). The minimization frontier, one row per variant and matcher: identity precision, recall, sibling and twin false merges and participant-count error
      (graded against the answer key from eval.minimization_runs), beside the label-free re-identification risk (mart_reidentification_risk) and data fitness per purpose (mart_minimization_fitness).
      Headline matcher: Fellegi-Sunter before review, automatic links only. Empty until `make minimize` has run.
    config:
      tags: [phase5]
    columns:
      - name: variant_id
        data_tests: [not_null]

  - name: eval_minimization_checks
    description: "GROUND TRUTH (evaluation only). Claims about the frontier: the full variant reproduces the default build, risk never rises as fields are coarsened, a hashed contact cannot activate."
    config:
      tags: [phase5]
    columns:
      - name: passed
        data_tests:
          - accepted_values: {arguments: {values: [true]}}

  - name: eval_chart_insights
    description: >
      EVALUATION. The numbers inside headline sentences of the cards graded against the synthetic answer key (long format, like the share chart_insights models): how many year-by-method checks
      had the truth inside the range, and what the data standard's field choice costs in matching accuracy.

  - name: eval_gmp_scenario
    description: >
      GROUND TRUTH (evaluation only, synthetic; Phase 7, ADR-025). Per program market with no participation source: the planning scenario's range and
      direction against the true latest-season participants and direction, the club proxy direction against the truth, and whether dbt's comparables
      differ from the generator's. The answer key's against-the-comparables share is an assumption.
    columns:
      - name: country_code
        data_tests: [unique, not_null]
  - name: eval_gmp_scenario_summary
    description: >
      GROUND TRUTH (evaluation only, synthetic; Phase 7, ADR-025 section 6). Coverage, direction error and proxy agreement of the planning scenario, for all
      markets with no participation source and split by whether the answer key set them against their comparables. NO pass threshold: reported as it
      comes out, as the evidence for or against publishing a number for a dark market.
    columns:
      - name: market_group
        data_tests:
          - unique
          - accepted_values: {arguments: {values: [ALL, WITH_COMPARABLES, SET_AGAINST_COMPARABLES]}}
