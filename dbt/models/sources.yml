version: 2

sources:
  - name: raw
    description: >
      Raw landing layer (SYNTHETIC data). Strings in, strings stored: no typing, trimming or
      cleaning. Loaded by loader/load_raw.py. Ground truth is never loaded here.
    schema: raw
    tables:
      - name: us_league_registrations
        description: >
          US youth league registration exports (CSV). One row per CSV data row. Every source column
          is VARCHAR; empty fields are '' (not NULL). `_row_number` is the 1-based data row index.
      - name: ca_club_records
        description: >
          Canadian club platform API dump, one row per API record. The nested record is kept whole in
          `record_json`; `_page` is the API page number. Pagination overlap can repeat a record.
      - name: school_headcounts
        description: >
          School and recreation program headcounts (CSV, Source E): one row per program per year per reporter, NO individuals. Every
          column is VARCHAR; empty fields are ''. `_row_number` is the 1-based data row index. A program-year can appear twice when two
          reporters both report it.
      - name: fan_accounts
        description: >
          Fan app / ticketing accounts snapshot (CSV, Source D): one row per account, adults only. Every column is VARCHAR; empty fields are ''.
          `_row_number` is the 1-based data row index. marketing_opt_in blank means not captured.
      - name: fan_events
        description: >
          Fan engagement event stream (JSON Lines, Source D), one row per delivered line, kept whole in `record_json`. `_source_file` is the DELIVERY
          month (events_YYYY_MM.jsonl): a late event sits in a later file than its event_ts. The same event_id can be delivered twice.
      - name: intl_federation_returns
        description: >
          International federation returns (XLSX). Every worksheet row is landed, including title,
          blank, header and summary rows, as positional columns c1..c9 (Player ID, Full Name,
          Date of Birth, Gender, Category, Club, Country, Email, Media Consent). `_excel_row` is
          the 1-based worksheet row; Excel date serials stay as their raw numeric string.
