version: 2

sources:
  - name: raw
    description: >
      Raw landing layer (SYNTHETIC data). Strings in, strings stored: no typing, trimming or
      cleaning. Loaded by loader/load_raw.py. Ground truth is never loaded here.
    schema: raw
    tables:
      - name: org_registry
        description: >
          The organization registry (what the program knows, not ground truth): one row per known organization and season with its region, ZIP3, registration channel and whether it
          sent a file that season. The denominator for coverage. Every column is VARCHAR.
      - name: us_league_registrations
        description: >
          US youth league registration exports (CSV). One row per CSV data row. Every source column
          is VARCHAR; empty fields are '' (not NULL). `_row_number` is the 1-based data row index.
      - name: ca_club_records
        description: >
          Canadian club platform API dump, one row per API record. The nested record is kept whole in
          `record_json`; `_page` is the API page number. Pagination overlap can repeat a record.
      - name: school_headcounts
        description: >
          School and recreation program headcounts (CSV, Source E): one row per program per year per reporter, NO individuals. Every
          column is VARCHAR; empty fields are ''. `_row_number` is the 1-based data row index. A program-year can appear twice when two
          reporters both report it.
      - name: fan_accounts
        description: >
          Fan app / ticketing accounts snapshot (CSV, Source D): one row per account, adults only. Every column is VARCHAR; empty fields are ''.
          `_row_number` is the 1-based data row index.
      - name: fan_events
        description: >
          Fan engagement event stream (JSON Lines, Source D), one row per delivered line, kept whole in `record_json`. `_source_file` is the DELIVERY
          month (events_YYYY_MM.jsonl): a late event sits in a later file than its event_ts. The same event_id can be delivered twice.
      - name: fan_consent_events
        description: >
          Fan consent changes (JSON Lines, Source D): one line per opt-in or opt-out of a channel (email, sms, push) at a capture point, kept whole in `record_json`.
          No event means not captured (NULL), never FALSE. A few opt-outs are timestamped before the opt-in they follow.
      - name: fan_transactions
        description: >
          Fan transactions (JSON Lines, one file per month, Source D): purchases (ticket, merch, subscription, other) and refunds, kept whole in `record_json`. A few
          refunds name an original transaction that does not exist.
      - name: intl_federation_returns
        description: >
          International federation returns (XLSX). Every worksheet row is landed, including title,
          blank, header and summary rows, as positional columns c1..c9 (Player ID, Full Name,
          Date of Birth, Gender, Category, Club, Country, Email, Media Consent). `_excel_row` is
          the 1-based worksheet row; Excel date serials stay as their raw numeric string.
      - name: gmp_proxy
        description: >
          Global Markets Program proxy returns (CSV, GMP_PROXY, Phase 7): one row per program market per season per filing club: club fan events,
          games in the market, whether a national flag federation exists. NO individuals and NOT participation (ADR-025). Every column is VARCHAR;
          `_row_number` is the 1-based data row index. Loaded by loader/load_phase7.py.
      - name: gmp_minimum_return
        description: >
          Minimum returns from program-market federations (CSV, Phase 7, contracts/templates/GMP_MINIMUM_RETURN.yml): counts of teams and players by
          region, age band and sex, one file per market and season (minimum_return_<country>_<season>.csv). NO individuals. EMPTY in the published
          build (no federation has sent one); the Italy experiment lands one on a copy of the warehouse (ADR-030). Every column is VARCHAR.
