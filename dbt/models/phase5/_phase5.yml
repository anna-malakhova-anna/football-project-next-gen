version: 2

models:
  - name: stg_p5_registrations
    description: >
      Phase 5 staging. The six feeds in one shape, one row per feed record. Bad values are flagged or NULLed, never guessed or dropped (a two-digit-year DOB is NULL, an
      ambiguous league stays unresolved). Pop Warner tackle rows are kept here with is_flag = false and removed before matching.
    columns:
      - name: feed
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [matrix_export, vendor_reg_a, vendor_reg_b, pop_warner_feed, pal_chapter_csv, school_program]}}
      - name: source_record_id
        data_tests: [not_null]

  - name: p5_idr_input_records
    description: One row per flag registration that identity resolution works on (exact duplicate rows collapsed). Same columns as idr_input_records so the Phase 2 macros run unchanged.
    columns:
      - name: match_record_id
        data_tests: [unique, not_null]

  - name: p5_clusters
    description: One row per input record with its resolved child (p5_person_id), from the AUTO_MATCH links only.
    columns:
      - name: match_record_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('p5_idr_input_records'), field: match_record_id}}

  - name: p5_record_quality
    description: One row per flag feed record with every fact the rules need as a plain column. Nothing here judges a record; the p5_dq_rules seed does.
    columns:
      - name: source_record_id
        data_tests: [not_null]
      - name: market_id
        data_tests: [not_null]

  - name: dq_rule_results_league
    description: Every rule evaluated for every league, with the rule's SQL and thresholds alongside the result (auditable).
  - name: dq_rule_results_market
    description: Every rule evaluated for every market, same shape.

  - name: dq_score_league
    description: >
      The league data quality scorecard: six dimension scores, an overall score and grade, and fitness for participation reporting (lower bar) and club activation
      (higher bar, needs consent provenance). For the data steward and league operators, not club-facing.
    columns:
      - name: league_group
        data_tests: [unique, not_null]
      - name: grade
        data_tests:
          - accepted_values: {arguments: {values: [A, B, C, D, INSUFFICIENT_DATA]}}

  - name: dq_score_market
    description: The market data quality scorecard (home ZIP3 to market). UNPLACED = no usable ZIP. For the data steward; the club-facing aggregate view is built in step 5.
    columns:
      - name: market_id
        data_tests: [unique, not_null]
      - name: grade
        data_tests:
          - accepted_values: {arguments: {values: [A, B, C, D, INSUFFICIENT_DATA]}}

  - name: dq_fix_list
    description: The top three actionable issues per league, worst shortfall first, phrased for the league operator.
    columns:
      - name: fix
        data_tests: [not_null]

  - name: p5_record_person
    description: RESTRICTED. Feed record to resolved child and usable parent email. The only place a record, a child and a parent contact meet.
  - name: p5_household
    description: RESTRICTED. Parent emails joined into households through the children they share. One row per email, with its household_id.
    columns:
      - name: contact_email
        data_tests: [unique, not_null]
  - name: p5_household_child
    description: RESTRICTED BRIDGE. household_id to p5_person_id. Counted by the funnel; read by nothing that decides activation.
  - name: p5_consent_event
    description: >
      RESTRICTED. One row per consent event on a registration, keyed by household (never by child): status, purposes, wording, timestamp, method, and provenance scored on WHAT, WHEN and WHICH WORDING.
      A blank marketing box produces no event: not captured is never FALSE.
    columns:
      - name: consent_event_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [GRANTED, DENIED, UNKNOWN]}}
      - name: provenance_score
        data_tests:
          - accepted_values: {arguments: {values: [0, 1, 2, 3], quote: false}}
  - name: p5_household_purpose_status
    description: RESTRICTED. The latest GRANTED or DENIED status per household and purpose, with the provenance of the deciding event.
  - name: p5_household_activation
    description: RESTRICTED. Is each household eligible for club activation, and if not, why. Only an explicit NFL_CLUB_MARKETING grant with the required provenance counts.
    columns:
      - name: household_id
        data_tests: [unique, not_null]
      - name: activation_status
        data_tests:
          - accepted_values: {arguments: {values: [ELIGIBLE, MARKETING_DECLINED, NO_MARKETING_OPT_IN_CAPTURED, GRANTED_BUT_NO_TIMESTAMP, GRANTED_BUT_WORDING_UNKNOWN]}}
  - name: p5_consent_funnel
    description: AGGREGATE. Participants to resolved households to households with known consent provenance to households eligible for club activation, with the reason for each drop. Counts only.
  - name: p5_purpose_limitation
    description: AGGREGATE. Households a careless reading of league-communications consent would have admitted to club activation, and that purpose limitation blocks.
  - name: p5_consent_provenance_by_feed
    description: AGGREGATE. Share of consent events that know what, when and on which wording, by feed.
