  - name: share_exec__gmp_scenario_other
    description: >
      Phase 7 (DP6 port global_other, ADR-025 section 3): the PLANNING SCENARIO, NOT a measurement, for markets with no participation source in the other 12 markets (one regime each, assumed). Every row carries scenario_label; never shown beside measured values.
    columns:
      - {name: country_code, meta: {pii: quasi}}
      - {name: country_name, meta: {pii: quasi}}
      - {name: region, meta: {pii: none}}
      - {name: legal_regime_id, meta: {pii: none}}
      - {name: regime_name, meta: {pii: none}}
      - name: regime_verification
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [UNVERIFIED, VERIFIED]}}
      - name: status
