version: 2

# EXEC share: aggregates only. meta.pii: direct | quasi | none (checked by scripts/check_share_policy.py).
models:
  - name: share_exec__participation_global
    description: Unique participants and related headline counts per year, small cells suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: unique_participants, meta: {pii: none}}
      - {name: registrations, meta: {pii: none}}
      - {name: registrations_per_participant, meta: {pii: none}}
      - {name: multi_org_participants, meta: {pii: none}}
      - {name: retention_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__participation_status
    description: Unique participants by growth status with a year total, small cells suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - name: status
        meta: {pii: none}
        data_tests:
          - accepted_values:
              arguments: {values: [NEW, RETURNING, REACTIVATED, CENSORED], config: {where: "status is not null"}}
      - {name: participants, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__participation_by_country
    description: Year x country, attributed (additive) and presence (non-additive) views; NULL country is the year total.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: country_code, meta: {pii: quasi}}
      - {name: participants_attributed, meta: {pii: none}}
      - {name: participants_present, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__participation_segments
    description: Year -> country -> age band hierarchy with girls' share of youth participation, small cells suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: country_code, meta: {pii: quasi}}
      - {name: age_band, meta: {pii: quasi}}
      - {name: participants, meta: {pii: none}}
      - {name: girls_share_of_youth, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__participation_by_sex
    description: Year x registration-reported sex with a year total, small cells suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: sex, meta: {pii: quasi}}
      - {name: participants, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__reported_headcount
    description: >
      Reported headcount from school and recreation programs (Source E) by year x country with a year total, and the combined-reach range.
      Program places, not participants. A country-year with fewer than k_min programs is suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: country_code, meta: {pii: quasi}}
      - {name: reporting_programs, meta: {pii: none}}
      - {name: reported_headcount, meta: {pii: none}}
      - {name: voluntary_program_headcount, meta: {pii: none}}
      - {name: combined_reach_low, meta: {pii: none}}
      - {name: combined_reach_high, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__fan_engagement_effect
    description: >
      Naive and matched estimates of the change in fan engagement after a household's first registration, aggregate only, small cells suppressed, with a
      caveat per row. Built from the restricted linkage schema (ADR-009); describes linked households only.
    columns:
      - {name: estimator, meta: {pii: none}}
      - {name: fan_uplift_pct, meta: {pii: none}}
      - {name: fan_uplift_ci_low_pct, meta: {pii: none}}
      - {name: fan_uplift_ci_high_pct, meta: {pii: none}}
      - {name: fan_treated_households, meta: {pii: none}}
      - {name: fan_match_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}
      - {name: caveat, meta: {pii: none}}

  - name: share_exec__household_link_rate
    description: >
      Program households, households linked to a fan account and the link rate, by country with a total. Counts and a rate only, small cells suppressed.
    columns:
      - {name: country_code, meta: {pii: quasi}}
      - {name: program_households, meta: {pii: none}}
      - {name: linked_households, meta: {pii: none}}
      - {name: household_link_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__participation_bounds
    description: Unique participants per year with the label-free identity bounds (low, point, high), small cells suppressed.
    columns:
      - {name: participation_year, meta: {pii: none}}
      - {name: identity_participants_low, meta: {pii: none}}
      - {name: identity_participants_point, meta: {pii: none}}
      - {name: identity_participants_high, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__retention_survival
    description: Kaplan-Meier retention by segment and years since entry with 95% intervals; age-outs and the end of the data are censored. Small cells suppressed.
    columns:
      - {name: segment_type, meta: {pii: none}}
      - {name: segment_value, meta: {pii: quasi}}
      - {name: years_since_entry, meta: {pii: none}}
      - {name: entry_cohort_size, meta: {pii: none}}
      - {name: km_at_risk, meta: {pii: none}}
      - {name: km_survival, meta: {pii: none}}
      - {name: km_survival_ci_low, meta: {pii: none}}
      - {name: km_survival_ci_high, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__retention_cohorts
    description: Cohort triangle for all entrants, with the share still registered and the share among players not yet aged out. Small cells suppressed.
    columns:
      - {name: entry_year, meta: {pii: none}}
      - {name: years_since_entry, meta: {pii: none}}
      - {name: entry_cohort_size, meta: {pii: none}}
      - {name: cohort_retention_pct, meta: {pii: none}}
      - {name: cohort_retention_among_eligible_pct, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__fan_funnel
    description: >
      Fan funnel by cohort year, segment and fan status: households, linked, contactable, active, monetized with step rates. Aggregate only, small cells suppressed (restricted linkage schema, ADR-009).
    columns:
      - {name: cohort_year, meta: {pii: none}}
      - {name: segment, meta: {pii: none}}
      - {name: fan_status, meta: {pii: none}}
      - {name: funnel_households, meta: {pii: none}}
      - {name: funnel_linked, meta: {pii: none}}
      - {name: funnel_contactable, meta: {pii: none}}
      - {name: funnel_active, meta: {pii: none}}
      - {name: funnel_monetized, meta: {pii: none}}
      - {name: funnel_link_rate, meta: {pii: none}}
      - {name: funnel_contactable_rate, meta: {pii: none}}
      - {name: funnel_active_rate, meta: {pii: none}}
      - {name: funnel_monetized_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__acquisition_incrementality
    description: >
      Incremental fan accounts attributable to the programme (estimate with interval) next to net-new households. One row; aggregate only.
    columns:
      - {name: methodology_version, meta: {pii: none}}
      - {name: incremental_fan_accounts, meta: {pii: none}}
      - {name: incremental_fan_accounts_ci_low, meta: {pii: none}}
      - {name: incremental_fan_accounts_ci_high, meta: {pii: none}}
      - {name: net_new_linked_households, meta: {pii: none}}
      - {name: net_new_households_scaled, meta: {pii: none}}
      - {name: market_years_compared, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}
      - {name: caveat, meta: {pii: none}}

  - name: share_exec__fan_value
    description: >
      Modelled lifetime value per fan account with a range, by fan group. Synthetic currency, illustrative; aggregate only.
    columns:
      - {name: fan_group, meta: {pii: none}}
      - {name: value_accounts, meta: {pii: none}}
      - {name: net_spend_per_active_month, meta: {pii: none}}
      - {name: expected_active_months, meta: {pii: none}}
      - {name: fan_ltv, meta: {pii: none}}
      - {name: fan_ltv_low, meta: {pii: none}}
      - {name: fan_ltv_high, meta: {pii: none}}
      - {name: horizon_months, meta: {pii: none}}
      - {name: currency_label, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__addressable_audience
    description: >
      Addressable audience and consent gap by month and household group. Counts only, never a list; small cells suppressed.
    columns:
      - {name: month, meta: {pii: none}}
      - {name: household_group, meta: {pii: none}}
      - {name: audience_registered, meta: {pii: none}}
      - {name: audience_linked, meta: {pii: none}}
      - {name: audience_contactable, meta: {pii: none}}
      - {name: audience_contactable_email, meta: {pii: none}}
      - {name: audience_contactable_sms, meta: {pii: none}}
      - {name: audience_contactable_push, meta: {pii: none}}
      - {name: audience_active, meta: {pii: none}}
      - {name: consent_gap_households, meta: {pii: none}}
      - {name: contactable_share_of_linked, meta: {pii: none}}
      - {name: consent_gap_share_of_active, meta: {pii: none}}
      - {name: consent_gap_value, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__market_quadrants
    description: >
      Synthetic markets with their flag/fan quadrant; markets below k_min are rolled up per quadrant. Aggregate only.
    columns:
      - {name: market_id, meta: {pii: quasi}}
      - {name: market_name, meta: {pii: quasi}}
      - {name: country_code, meta: {pii: quasi}}
      - {name: quadrant, meta: {pii: none}}
      - {name: is_team_market, meta: {pii: none}}
      - {name: launch_year, meta: {pii: none}}
      - {name: household_population, meta: {pii: none}}
      - {name: markets_in_row, meta: {pii: none}}
      - {name: participant_households, meta: {pii: none}}
      - {name: fan_accounts, meta: {pii: none}}
      - {name: participation_per_1000, meta: {pii: none}}
      - {name: fan_accounts_per_1000, meta: {pii: none}}
      - {name: net_new_rate, meta: {pii: none}}
      - {name: link_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__fan_rfm
    description: >
      RFM segment mix by year and fan group. Aggregate only, small cells suppressed.
    columns:
      - {name: year, meta: {pii: none}}
      - {name: fan_group, meta: {pii: none}}
      - {name: segment, meta: {pii: none}}
      - {name: rfm_accounts, meta: {pii: none}}
      - {name: rfm_share, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__fan_survival
    description: >
      Kaplan-Meier fan survival by fan group and months since origin with interval. Aggregate only.
    columns:
      - {name: fan_group, meta: {pii: none}}
      - {name: months_since_origin, meta: {pii: none}}
      - {name: survival_at_risk, meta: {pii: none}}
      - {name: fan_survival, meta: {pii: none}}
      - {name: fan_survival_ci_low, meta: {pii: none}}
      - {name: fan_survival_ci_high, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__fan_value_uplift
    description: >
      Matched value uplift among existing fans by status group and outcome. Linked households only; synthetic currency.
    columns:
      - {name: uplift_status_group, meta: {pii: none}}
      - {name: uplift_outcome, meta: {pii: none}}
      - {name: uplift_outcome_kind, meta: {pii: none}}
      - {name: uplift_households, meta: {pii: none}}
      - {name: uplift_per_month, meta: {pii: none}}
      - {name: uplift_ci_low_per_month, meta: {pii: none}}
      - {name: uplift_ci_high_per_month, meta: {pii: none}}
      - {name: uplift_pct, meta: {pii: none}}
      - {name: uplift_naive_pct, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}

  - name: share_exec__consent_capture
    description: >
      Opt-in rate by capture point and channel. No record is not a no. Aggregate only.
    columns:
      - {name: consent_cut, meta: {pii: none}}
      - {name: consent_dimension_value, meta: {pii: none}}
      - {name: consent_channel, meta: {pii: none}}
      - {name: consent_lines, meta: {pii: none}}
      - {name: consent_opt_ins, meta: {pii: none}}
      - {name: consent_opt_in_rate, meta: {pii: none}}
      - name: suppressed
        meta: {pii: none}
        data_tests:
          - accepted_values: {arguments: {values: [NONE, PRIMARY, SECONDARY]}}
