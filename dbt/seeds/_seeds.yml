version: 2

seeds:
  - name: division_map
    description: >
      Maps every source division / program / category label to a canonical division. Owned by the
      project (not the sources). Matching is exact on trimmed `source_label` within `source_system`.
      Boundaries follow the Dec 31 age convention (ADR-002); `notes` records where a source label
      does not line up with the canonical age bands.
    config:
      column_types: {source_system: varchar, source_label: varchar, canonical_division: varchar, notes: varchar}
    columns:
      - name: source_system
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [US_LEAGUE, CA_CLUB, INTL_FED]}}
      - name: source_label
        data_tests: [not_null]
      - name: canonical_division
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [U6, U8, U10, U12, U14, U17, ADULT_W, ADULT_M, ADULT_MIXED]

  - name: country_map
    description: >
      Any country representation seen in the sources -> ISO 3166-1 alpha-2. Matching is
      case-insensitive on trimmed `source_value`.
    config:
      column_types: {source_value: varchar, country_code: varchar, notes: varchar}
    columns:
      - name: source_value
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [US, CA, MX, GB, JP, DE, AT, PA]}}

  - name: gender_map
    description: >
      Registration-reported sex value -> F / M / U. Gender identity is out of scope and not
      collected. Blank or unmapped values become U in staging (never guessed).
    config:
      column_types: {source_value: varchar, sex_code: varchar, notes: varchar}
    columns:
      - name: source_value
        data_tests: [not_null]
      - name: sex_code
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [F, M, U]}}

  - name: dq_defect_config
    description: >
      CONFIGURED defect-injection rates, exported from config/generation.yaml by
      generator/export_config_seed.py (`make generate`). Used by dq_summary to compare observed vs
      configured. `kind`: rate = configured rate, structural = configured exact count, zero = nothing
      injected (expect 0). `denominator_kind` says what the rate is a share of. `detectable_phase1` is
      false when only identity matching (Phase 2) or a second source could reveal the defect.
    config:
      column_types:
        source_system: varchar
        defect_id: varchar
        kind: varchar
        configured_rate: double
        configured_count: integer
        denominator_kind: varchar
        denominator_description: varchar
        detectable_phase1: boolean
        rule_description: varchar
    columns:
      - name: defect_id
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: [rate, structural, zero]}}

  - name: nickname_map
    description: >
      Given name to nickname pairs (English, French, Spanish), as lowercase accent-stripped name keys.
      Used in both directions by the name comparison. Written from general knowledge of common nicknames,
      not derived from the generator.
    config:
      column_types: {given_key: varchar, nickname_key: varchar, language: varchar}
    columns:
      - name: given_key
        data_tests: [not_null]
      - name: nickname_key
        data_tests: [not_null]
      - name: language
        data_tests:
          - accepted_values: {arguments: {values: [en, fr, es]}}

  - name: match_m_probabilities
    description: >
      Assumed m-probabilities for the Fellegi-Sunter matcher: P(feature level | same person). Reasoned from the
      source descriptions and documented defect behaviour in the `rationale` column. NEVER tuned against ground
      truth. Probabilities for each feature sum to 1.
    config:
      column_types: {feature: varchar, level: varchar, m_probability: double, rationale: varchar}
    columns:
      - name: feature
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [first_name, last_name, dob, email, phone, postal, sex, context]
      - name: level
        data_tests: [not_null]
      - name: m_probability
        data_tests: [not_null]
      - name: rationale
        data_tests: [not_null]

  - name: match_thresholds
    description: >
      Tier cut-offs and prior odds, one row per matcher version. AUTO_MATCH at probability >= t_auto;
      PROBABLE (review queue) from t_review up to t_auto; NON_MATCH below t_review.
    config:
      column_types: {matcher_version: varchar, t_auto: double, t_review: double, prior_odds: double, rationale: varchar}
    columns:
      - name: matcher_version
        data_tests: [not_null, unique]

  - name: review_decisions
    description: >
      Data steward overrides. Starts empty (header only). decision is MATCH or NO_MATCH for the pair
      (record_a, record_b) of match_record_ids; record_a < record_b.
    config:
      column_types:
        record_a: varchar
        record_b: varchar
        decision: varchar
        decided_by: varchar
        decided_at: timestamp
        note: varchar

  - name: metric_catalog
    description: >
      Every metric reported in a Phase 3 mart, share or the KPI scorecard, with its definition, grain, additivity and
      owner. A test fails if a KPI or a share metric column is missing here. docs/metrics.md is generated from it.
      additivity: ADDITIVE (sum across any dimension of its grain), ADDITIVE_BY_ATTRIBUTION (sums across countries only
      in the attributed view), NON_ADDITIVE (distinct counts that overlap), RATIO (recompute from parts), STATE
      (point-in-time).
    config:
      tags: [phase3]
      column_types: {metric_id: varchar, name: varchar, definition: varchar, grain: varchar, additivity: varchar, owner: varchar, methodology_version: varchar, kpi_group: varchar, unit: varchar, introduced_in: varchar, definition_changed_in: varchar}
    columns:
      - name: metric_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: definition
        data_tests: [not_null]
      - name: grain
        data_tests: [not_null]
      - name: additivity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ADDITIVE, ADDITIVE_BY_ATTRIBUTION, NON_ADDITIVE, RATIO, STATE]
      - name: owner
        data_tests: [not_null]
      - name: methodology_version
        data_tests: [not_null]
      - name: kpi_group
        data_tests:
          - accepted_values:
              arguments:
                values: [north_star, growth, reach, depth, data_trust, supporting]
      - name: unit
        data_tests:
          - accepted_values: {arguments: {values: [count, rate, ratio, percent]}}

  - name: reporting_periods
    description: >
      Participation years (calendar years, rule C3) and US seasons (rule C4) with their date ranges and the age cutoff
      date (December 31, ADR-002).
    config:
      tags: [phase3]
      column_types: {period_id: varchar, period_type: varchar, participation_year: integer, term: varchar, start_date: date, end_date: date, cutoff_date: date}
    columns:
      - name: period_id
        data_tests: [unique, not_null]
      - name: period_type
        data_tests:
          - accepted_values: {arguments: {values: [YEAR, US_SEASON]}}
      - name: term
        data_tests:
          - accepted_values: {arguments: {values: [ANNUAL, SPRING, FALL]}}

  - name: privacy_params
    description: >
      Privacy parameters in one place: the small-cell threshold k_min, whether secondary suppression is on, the youth
      and minor ages, the analyst postal prefix length.
    config:
      tags: [phase3]
      column_types: {param: varchar, value: varchar, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]

  - name: audience_column_policy
    description: >
      The column-level access policy: for each audience and share model, every column that may appear (allowed = Y,
      with its treatment) and notable columns that may NOT (allowed = N). model '*' applies to every model of the
      audience. scripts/check_share_policy.py fails on any column in a share that is not listed as allowed.
    config:
      tags: [phase3]
      column_types: {audience: varchar, model: varchar, column: varchar, allowed: varchar, treatment: varchar}
    columns:
      - name: audience
        data_tests:
          - accepted_values: {arguments: {values: [exec, analyst, ops, marketing, media, club, privacy]}}
      - name: allowed
        data_tests:
          - accepted_values: {arguments: {values: ['Y', 'N']}}
      - name: treatment
        data_tests: [not_null]

  - name: source_registry
    description: >
      Sources known to the program and their onboarding status, mirrored from docs/source_inventory.md. Feeds the data
      trust KPIs "sources onboarded" and "sources known". The two Phase 4 sources are known (planned) but not onboarded.
    config:
      tags: [phase3]
      column_types: {source_system: varchar, onboarding_status: varchar, description: varchar}
    columns:
      - name: source_system
        data_tests: [unique, not_null]
      - name: onboarding_status
        data_tests:
          - accepted_values:
              arguments:
                values: [Discovery, Profiling, Contracted, Staged, Modelled, Production]

  - name: dq_flag_severity
    description: >
      Classifies every data-quality flag: AFFECTS_COUNT (duplicates, impossible or unparseable DOB, unmapped values: can
      change what is counted or how a record is classified), MISSING_VALUE (a value that was not captured, left NULL or U),
      NORMALIZED (cosmetic, repaired in staging). The KPI "registrations failing DQ rules" counts AFFECTS_COUNT only.
    config:
      tags: [phase3]
      column_types: {flag: varchar, severity: varchar, treatment: varchar}
    columns:
      - name: flag
        data_tests: [unique, not_null]
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: [AFFECTS_COUNT, MISSING_VALUE, NORMALIZED]

  - name: observation_window
    description: >
      The observed data window, exported from config (seasons.first_observed_year and the last year in seasons.years) by
      generator/export_config_seed.py. The first observed year is left-censored: nobody in it can be classed new or
      returning. Models read the censored year from here; none hardcodes a year.
    config:
      tags: [phase3]
      column_types: {first_observed_year: integer, last_observed_year: integer}
    columns:
      - name: first_observed_year
        data_tests: [not_null]
      - name: last_observed_year
        data_tests: [not_null]

  - name: market_map
    description: >
      SYNTHETIC markets (rework spec, section 2): US ZIP3 groups, Canadian FSA groups and one market per international country. household_population is an
      invented denominator, not a real figure; launch_year is the year the flag programme started in the market (blank: it has not launched), an operational fact
      the programme knows, not ground truth. About 40% are team markets.
    config:
      tags: [phase4]
      column_types: {market_id: varchar, market_name: varchar, country_code: varchar, region_code: varchar, is_team_market: varchar, household_population: integer, launch_year: integer, notes: varchar}
    columns:
      - name: market_id
        data_tests: [unique, not_null]
      - name: is_team_market
        data_tests:
          - accepted_values: {arguments: {values: ['Y', 'N']}}

  - name: market_geo_map
    description: >
      Which market a US ZIP3 prefix or a Canadian FSA belongs to. International returns carry no postal code and map to their country's market through market_map.
    config:
      tags: [phase4]
      column_types: {country_code: varchar, prefix: varchar, market_id: varchar}
    columns:
      - name: prefix
        data_tests: [not_null]

  - name: fan_params
    description: >
      Windows for the fan status of a participant household (rework spec 4.2): the active window, the lapsed window and the reactivation window. Models read them
      from here; no model hard-codes a window length.
    config:
      tags: [phase4]
      column_types: {param: varchar, value: integer, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]

  - name: rfm_segment_map
    description: >
      Names for RFM segments (rework spec 5.4). r_score is the recency quintile (5 = most recent) and fm_score is the rounded mean of the frequency and monetary quintiles (5 = highest).
      Champions: recent and high value; Loyal: reasonably recent and valuable; Promising: recent but low value; At risk: valuable but not recent; Hibernating: neither.
    config:
      tags: [phase4]
      column_types: {r_score: integer, fm_score: integer, segment: varchar}
    columns:
      - name: segment
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [Champions, Loyal, Promising, At risk, Hibernating]}}

  - name: market_quadrant_params
    description: >
      Thresholds for the market quadrants (rework spec 5.6). A blank value means "use the median" (of launched markets for participation, of all markets for fan accounts); a number overrides it.
      No model hard-codes a threshold.
    config:
      tags: [phase4]
      column_types: {param: varchar, value: double, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]


  - name: p5_consent_wording_map
    description: >
      Phase 5. Maps each feed's consent wording to what it grants and which purposes it covers. The purposes are ASSUMPTIONS inferred from the wording; which wording is
      live on each platform is an open question for the stakeholders (docs/questions-for-stakeholders.md). A value not in this map is an unrecognized wording.
      wording_is_full_text says whether the captured string reproduces the wording shown to the parent (true) or is only a code or a yes (false).
    config:
      tags: [phase5]
      column_types: {wording_is_full_text: boolean}

  - name: p5_params
    description: Phase 5 scorecard parameters (season starts, plausible ages, lateness, grade bands), exported from config/generation.yaml phase5. Nothing in the scorecard models is hard-coded.
    config:
      tags: [phase5]
      column_types: {param: varchar, value: varchar, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]

  - name: data_standard_fields
    description: >
      The minimum viable data standard, machine-readable (ADR-016 and docs/data-standard.md): one row per field a league or channel must submit, with definition, format (a regex pattern or allowed
      values), REQUIRED or CONDITIONAL, the purposes it serves (from dq_purposes), PII class, retention rule, the evidence that justifies the field's granularity (a link to the minimization result)
      and the rationale. The validate_against_standard macro checks any source against this table; results land in dq_rule_results with origin STANDARD.
    config:
      tags: [phase5]
      column_types: {ordinal: integer, field_name: varchar, definition: varchar, format: varchar, pattern: varchar, allowed_values: varchar, requirement: varchar, purposes: varchar, pii_class: varchar, retention_rule: varchar, evidence: varchar, rationale: varchar}
    columns:
      - name: field_name
        data_tests: [unique, not_null]
      - name: requirement
        data_tests:
          - accepted_values: {arguments: {values: [REQUIRED, CONDITIONAL, OPTIONAL]}}
      - name: pii_class
        data_tests:
          - accepted_values: {arguments: {values: [none, quasi, direct]}}

  - name: p5_consent_purposes
    description: >
      Phase 5. The purpose taxonomy for consent: league operations, league communications, NFL and club marketing, third-party disclosure, profiling. separate_consent_required marks
      purposes that need their own opt-in; counts_for_club_activation marks the only purpose that can make a household eligible for club activation (NFL_CLUB_MARKETING).
    config:
      tags: [phase5]
      column_types: {purpose_id: varchar, label: varchar, description: varchar, separate_consent_required: boolean, counts_for_club_activation: boolean, note: varchar}
    columns:
      - name: purpose_id
        data_tests: [unique, not_null]

  - name: dq_rule_registry
    description: >
      Phase 5. The ONE registry of data quality rules (ADR-014). One row per rule: id, dimension, what it applies to, grain (RECORD, ORG_SEASON or SOURCE_SEASON), the SQL predicate (check_sql:
      TRUE passes, FALSE fails, NULL is not applicable), the purposes it serves with a minimum pass rate for each (threshold_<PURPOSE>, blank = not applicable), severity (ERROR and WARN judge a
      record, INFO only reports), a fictional owner role, plain-language fix guidance, and origin: PHASE1 (a Phase 1 flag), CONTRACT (a contract's quality rule, read from quality.dq_contract_results and
      referenced by contract_ref, never restated) or PHASE5. Generated by scripts/build_rule_registry.py; a test keeps it in step with dq_flag_severity and the contracts.
    config:
      tags: [phase5]
      column_types: {rule_id: varchar, dimension: varchar, applies_to: varchar, grain: varchar, check_sql: varchar, purposes: varchar, threshold_COUNT: double, threshold_SEGMENT: double, threshold_GEO: double, threshold_RETAIN: double, threshold_ACTIVATE: double, severity: varchar, owner_role: varchar, fix_guidance: varchar, origin: varchar, contract_ref: varchar}
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: dimension
        data_tests:
          - accepted_values: {arguments: {values: [COMPLETENESS, VALIDITY, UNIQUENESS, CONSISTENCY, TIMELINESS, CONFORMITY, CONSENT_PROVENANCE]}}
      - name: grain
        data_tests:
          - accepted_values: {arguments: {values: [RECORD, ORG_SEASON, SOURCE_SEASON]}}
      - name: severity
        data_tests:
          - accepted_values: {arguments: {values: [INFO, WARN, ERROR]}}
      - name: origin
        data_tests:
          - accepted_values: {arguments: {values: [PHASE1, CONTRACT, STANDARD, PHASE5]}}

  - name: dq_purposes
    description: The five purposes a record can be fit for (COUNT, SEGMENT, GEO, RETAIN, ACTIVATE), the question each supports and its bar. Every score is computed per purpose.
    config:
      tags: [phase5]
    columns:
      - name: purpose
        data_tests: [unique, not_null]

  - name: dq_grade_bands
    description: Grade bands on the 0 to 100 score (A at 95, B at 85, C at 70, D below). Bands live in this seed, not in a model.
    config:
      tags: [phase5]
      column_types: {grade: varchar, min_score: double, description: varchar}
    columns:
      - name: grade
        data_tests: [unique, not_null]

  - name: consent_text_versions
    description: The consent wording versions an organization's form can use and the purposes each names, exported from config/generation.yaml org_quality.consent_text_versions. A marketing opt-in on a version with no club-marketing purpose is not evidence of that consent.
    config:
      tags: [phase5]
      column_types: {consent_text_version: varchar, purposes: varchar, covers_club_marketing: boolean}
    columns:
      - name: consent_text_version
        data_tests: [unique, not_null]

  - name: dq_severity_weights
    description: How much a rule of each severity counts in a dimension score (ERROR 3, WARN 1, INFO 0). A dimension score is the weighted mean pass rate of the rules in it that apply to the purpose.
    config:
      tags: [phase5]
      column_types: {severity: varchar, weight: double, description: varchar}
    columns:
      - name: severity
        data_tests: [unique, not_null]

  - name: consent_purposes
    description: >
      The purpose taxonomy for consent (spec section 8): LEAGUE_OPS, LEAGUE_COMMS, CLUB_MARKETING, PARTNER_DISCLOSURE, PROFILING, PHOTO_MEDIA. separate_consent_required marks purposes that need their own
      opt-in; counts_for_club_activation marks the only purpose that can make a household eligible for club activation (CLUB_MARKETING). A consent for one purpose is never read as another.
    config:
      tags: [phase5]
      column_types: {purpose_id: varchar, label: varchar, description: varchar, separate_consent_required: boolean, counts_for_club_activation: boolean, note: varchar}
    columns:
      - name: purpose_id
        data_tests: [unique, not_null]

  - name: club_market_map
    description: >
      ZIP3 to club market (spec section 9.1): 32 club markets plus NO_CLUB_MARKET over the project's ZIP3 universe, with allocation weights that sum to 1 per ZIP3. A shared market (an NY/NJ or Los Angeles
      style metro) maps its ZIP3 to two markets with equal weights, the default and labelled as such (mapping_method SHARED_EQUAL_SPLIT). **PROJECT APPROXIMATION: contiguous ZIP3 groups inside a state; this is
      not any club's actual territory definition** (ADR-016). Canadian and international records map to OUTSIDE_US in the models, not here. Generated by generator/phase5/export_seed.py from phase5.club_markets.
    config:
      tags: [phase5]
      column_types: {zip3: varchar, club_market_id: varchar, market_name: varchar, state: varchar, allocation_weight: double, mapping_method: varchar, approximation_note: varchar}
    columns:
      - name: zip3
        data_tests: [not_null]
      - name: allocation_weight
        data_tests: [not_null]
      - name: mapping_method
        data_tests:
          - accepted_values: {arguments: {values: [CONTIGUOUS_ZIP3_GROUP, SHARED_EQUAL_SPLIT, NO_CLUB_MARKET]}}

  - name: population_denominators
    description: >
      Population denominators for participation rates (Phase 3 rule: figures are NEVER invented). Empty by design. Anna may fill it from the US Census ACS with scripts/fetch_acs_youth_population.py, which
      writes the source name, table id, URL and retrieval date on every row; until then every participation rate shows "denominator not loaded" and no rate is computed. A rate that is computed carries the label
      "illustrative only: synthetic participant counts over real population denominators".
    config:
      tags: [phase5]
      column_types: {country_code: varchar, region_code: varchar, zip3: varchar, age_band: varchar, year: integer, population: double, source_name: varchar, source_table_id: varchar, source_url: varchar, retrieved_date: varchar}

  - name: minimization_variants
    description: >
      The five minimization variants of the Phase 5 trade-off (spec 7): how DOB, postal code, phone and email are coarsened before identity resolution (dbt var minimization_variant),
      and which registry rules can no longer be evaluated on the coarsened data. Configuration, not ground truth.
    config:
      column_types: {variant_id: varchar, sort_order: integer, label: varchar, dob_treatment: varchar, postal_treatment: varchar, phone_treatment: varchar, email_treatment: varchar, unevaluable_rules: varchar, in_standard: boolean, rationale: varchar}
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: dob_treatment
        data_tests: [{accepted_values: {arguments: {values: [FULL, YEAR_MONTH, YEAR]}}}]
      - name: postal_treatment
        data_tests: [{accepted_values: {arguments: {values: [FULL, ZIP3]}}}]
      - name: phone_treatment
        data_tests: [{accepted_values: {arguments: {values: [KEEP, DROP]}}}]
      - name: email_treatment
        data_tests: [{accepted_values: {arguments: {values: [CLEAR, HASH]}}}]
      - name: in_standard
        description: "The variant the data standard cites (chosen by Anna, 2026-10-14: V2_BIRTH_YEAR). Exactly one row is true."
        data_tests: [not_null]
