version: 2

seeds:
  - name: division_map
    description: >
      Maps every source division / program / category label to a canonical division. Owned by the
      project (not the sources). Matching is exact on trimmed `source_label` within `source_system`.
      Boundaries follow the Dec 31 age convention (ADR-002); `notes` records where a source label
      does not line up with the canonical age bands.
    config:
      column_types: {source_system: varchar, source_label: varchar, canonical_division: varchar, notes: varchar}
    columns:
      - name: source_system
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [US_LEAGUE, CA_CLUB, INTL_FED]}}
      - name: source_label
        data_tests: [not_null]
      - name: canonical_division
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [U6, U8, U10, U12, U14, U17, ADULT_W, ADULT_M, ADULT_MIXED]

  - name: country_map
    description: >
      Any country representation seen in the sources -> ISO 3166-1 alpha-2. Matching is
      case-insensitive on trimmed `source_value`.
    config:
      column_types: {source_value: varchar, country_code: varchar, notes: varchar}
    columns:
      - name: source_value
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [US, CA, MX, GB, JP, DE, AT, PA]}}

  - name: gender_map
    description: >
      Registration-reported sex value -> F / M / U. Gender identity is out of scope and not
      collected. Blank or unmapped values become U in staging (never guessed).
    config:
      column_types: {source_value: varchar, sex_code: varchar, notes: varchar}
    columns:
      - name: source_value
        data_tests: [not_null]
      - name: sex_code
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [F, M, U]}}

  - name: dq_defect_config
    description: >
      CONFIGURED defect-injection rates, exported from config/generation.yaml by
      generator/export_config_seed.py (`make generate`). Used by dq_summary to compare observed vs
      configured. `kind`: rate = configured rate, structural = configured exact count, zero = nothing
      injected (expect 0). `denominator_kind` says what the rate is a share of. `detectable_phase1` is
      false when only identity matching (Phase 2) or a second source could reveal the defect.
    config:
      column_types:
        source_system: varchar
        defect_id: varchar
        kind: varchar
        configured_rate: double
        configured_count: integer
        denominator_kind: varchar
        denominator_description: varchar
        detectable_phase1: boolean
        rule_description: varchar
    columns:
      - name: defect_id
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: [rate, structural, zero]}}

  - name: nickname_map
    description: >
      Given name to nickname pairs (English, French, Spanish), as lowercase accent-stripped name keys.
      Used in both directions by the name comparison. Written from general knowledge of common nicknames,
      not derived from the generator.
    config:
      column_types: {given_key: varchar, nickname_key: varchar, language: varchar}
    columns:
      - name: given_key
        data_tests: [not_null]
      - name: nickname_key
        data_tests: [not_null]
      - name: language
        data_tests:
          - accepted_values: {arguments: {values: [en, fr, es]}}

  - name: match_m_probabilities
    description: >
      Assumed m-probabilities for the Fellegi-Sunter matcher: P(feature level | same person). Reasoned from the
      source descriptions and documented defect behaviour in the `rationale` column. NEVER tuned against ground
      truth. Probabilities for each feature sum to 1.
    config:
      column_types: {feature: varchar, level: varchar, m_probability: double, rationale: varchar}
    columns:
      - name: feature
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [first_name, last_name, dob, email, phone, postal, sex, context]
      - name: level
        data_tests: [not_null]
      - name: m_probability
        data_tests: [not_null]
      - name: rationale
        data_tests: [not_null]

  - name: match_thresholds
    description: >
      Tier cut-offs and prior odds, one row per matcher version. AUTO_MATCH at probability >= t_auto;
      PROBABLE (review queue) from t_review up to t_auto; NON_MATCH below t_review.
    config:
      column_types: {matcher_version: varchar, t_auto: double, t_review: double, prior_odds: double, rationale: varchar}
    columns:
      - name: matcher_version
        data_tests: [not_null, unique]

  - name: review_decisions
    description: >
      Data steward overrides. Starts empty (header only). decision is MATCH or NO_MATCH for the pair
      (record_a, record_b) of match_record_ids; record_a < record_b.
    config:
      column_types:
        record_a: varchar
        record_b: varchar
        decision: varchar
        decided_by: varchar
        decided_at: timestamp
        note: varchar

  - name: metric_catalog
    description: >
      Every metric reported in a Phase 3 mart, share or the KPI scorecard, with its definition, grain, additivity and
      owner. A test fails if a KPI or a share metric column is missing here. docs/metrics.md is generated from it.
      additivity: ADDITIVE (sum across any dimension of its grain), ADDITIVE_BY_ATTRIBUTION (sums across countries only
      in the attributed view), NON_ADDITIVE (distinct counts that overlap), RATIO (recompute from parts), STATE
      (point-in-time).
    config:
      tags: [phase3]
      column_types: {metric_id: varchar, name: varchar, definition: varchar, grain: varchar, additivity: varchar, owner: varchar, methodology_version: varchar, kpi_group: varchar, unit: varchar, introduced_in: varchar, definition_changed_in: varchar}
    columns:
      - name: metric_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: definition
        data_tests: [not_null]
      - name: grain
        data_tests: [not_null]
      - name: additivity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ADDITIVE, ADDITIVE_BY_ATTRIBUTION, NON_ADDITIVE, RATIO, STATE]
      - name: owner
        data_tests: [not_null]
      - name: methodology_version
        data_tests: [not_null]
      - name: kpi_group
        data_tests:
          - accepted_values:
              arguments:
                values: [north_star, growth, reach, depth, data_trust, supporting]
      - name: unit
        data_tests:
          - accepted_values: {arguments: {values: [count, rate, ratio]}}

  - name: reporting_periods
    description: >
      Participation years (calendar years, rule C3) and US seasons (rule C4) with their date ranges and the age cutoff
      date (December 31, ADR-002).
    config:
      tags: [phase3]
      column_types: {period_id: varchar, period_type: varchar, participation_year: integer, term: varchar, start_date: date, end_date: date, cutoff_date: date}
    columns:
      - name: period_id
        data_tests: [unique, not_null]
      - name: period_type
        data_tests:
          - accepted_values: {arguments: {values: [YEAR, US_SEASON]}}
      - name: term
        data_tests:
          - accepted_values: {arguments: {values: [ANNUAL, SPRING, FALL]}}

  - name: privacy_params
    description: >
      Privacy parameters in one place: the small-cell threshold k_min, whether secondary suppression is on, the youth
      and minor ages, the analyst postal prefix length.
    config:
      tags: [phase3]
      column_types: {param: varchar, value: varchar, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]

  - name: audience_column_policy
    description: >
      The column-level access policy: for each audience and share model, every column that may appear (allowed = Y,
      with its treatment) and notable columns that may NOT (allowed = N). model '*' applies to every model of the
      audience. scripts/check_share_policy.py fails on any column in a share that is not listed as allowed.
    config:
      tags: [phase3]
      column_types: {audience: varchar, model: varchar, column: varchar, allowed: varchar, treatment: varchar}
    columns:
      - name: audience
        data_tests:
          - accepted_values: {arguments: {values: [exec, analyst, ops, marketing, media]}}
      - name: allowed
        data_tests:
          - accepted_values: {arguments: {values: ['Y', 'N']}}
      - name: treatment
        data_tests: [not_null]

  - name: source_registry
    description: >
      Sources known to the program and their onboarding status, mirrored from docs/source_inventory.md. Feeds the data
      trust KPIs "sources onboarded" and "sources known". The two Phase 4 sources are known (planned) but not onboarded.
    config:
      tags: [phase3]
      column_types: {source_system: varchar, onboarding_status: varchar, description: varchar}
    columns:
      - name: source_system
        data_tests: [unique, not_null]
      - name: onboarding_status
        data_tests:
          - accepted_values:
              arguments:
                values: [Discovery, Profiling, Contracted, Staged, Modelled, Production]

  - name: dq_flag_severity
    description: >
      Classifies every data-quality flag: AFFECTS_COUNT (duplicates, impossible or unparseable DOB, unmapped values: can
      change what is counted or how a record is classified), MISSING_VALUE (a value that was not captured, left NULL or U),
      NORMALIZED (cosmetic, repaired in staging). The KPI "registrations failing DQ rules" counts AFFECTS_COUNT only.
    config:
      tags: [phase3]
      column_types: {flag: varchar, severity: varchar, treatment: varchar}
    columns:
      - name: flag
        data_tests: [unique, not_null]
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: [AFFECTS_COUNT, MISSING_VALUE, NORMALIZED]

  - name: observation_window
    description: >
      The observed data window, exported from config (seasons.first_observed_year and the last year in seasons.years) by
      generator/export_config_seed.py. The first observed year is left-censored: nobody in it can be classed new or
      returning. Models read the censored year from here; none hardcodes a year.
    config:
      tags: [phase3]
      column_types: {first_observed_year: integer, last_observed_year: integer}
    columns:
      - name: first_observed_year
        data_tests: [not_null]
      - name: last_observed_year
        data_tests: [not_null]

  - name: market_map
    description: >
      SYNTHETIC markets (rework spec, section 2): US ZIP3 groups, Canadian FSA groups and one market per international country. household_population is an
      invented denominator, not a real figure; launch_year is the year the flag programme started in the market (blank: it has not launched), an operational fact
      the programme knows, not ground truth. About 40% are team markets.
    config:
      tags: [phase4]
      column_types: {market_id: varchar, market_name: varchar, country_code: varchar, region_code: varchar, is_team_market: varchar, household_population: integer, launch_year: integer, notes: varchar}
    columns:
      - name: market_id
        data_tests: [unique, not_null]
      - name: is_team_market
        data_tests:
          - accepted_values: {arguments: {values: ['Y', 'N']}}

  - name: market_geo_map
    description: >
      Which market a US ZIP3 prefix or a Canadian FSA belongs to. International returns carry no postal code and map to their country's market through market_map.
    config:
      tags: [phase4]
      column_types: {country_code: varchar, prefix: varchar, market_id: varchar}
    columns:
      - name: prefix
        data_tests: [not_null]

  - name: fan_params
    description: >
      Windows for the fan status of a participant household (rework spec 4.2): the active window, the lapsed window and the reactivation window. Models read them
      from here; no model hard-codes a window length.
    config:
      tags: [phase4]
      column_types: {param: varchar, value: integer, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]

  - name: rfm_segment_map
    description: >
      Names for RFM segments (rework spec 5.4). r_score is the recency quintile (5 = most recent) and fm_score is the rounded mean of the frequency and monetary quintiles (5 = highest).
      Champions: recent and high value; Loyal: reasonably recent and valuable; Promising: recent but low value; At risk: valuable but not recent; Hibernating: neither.
    config:
      tags: [phase4]
      column_types: {r_score: integer, fm_score: integer, segment: varchar}
    columns:
      - name: segment
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [Champions, Loyal, Promising, At risk, Hibernating]}}

  - name: market_quadrant_params
    description: >
      Thresholds for the market quadrants (rework spec 5.6). A blank value means "use the median" (of launched markets for participation, of all markets for fan accounts); a number overrides it.
      No model hard-codes a threshold.
    config:
      tags: [phase4]
      column_types: {param: varchar, value: double, description: varchar}
    columns:
      - name: param
        data_tests: [unique, not_null]

