name: counting_flag_football
version: "0.1.0"
config-version: 2
profile: counting_flag_football

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Age convention (ADR-002): age is computed as of this month-day of the season year.
  age_cutoff_month_day: "12-31"
  # Gmail dot/plus-address folding is OFF: it can merge distinct people (see normalize_email).
  email_fold_gmail: false
  # Name comparison (Jaro-Winkler, 0 to 1). DuckDB scale; Snowflake's JAROWINKLER_SIMILARITY is 0 to 100.
  name_fuzzy_high: 0.92
  name_fuzzy_low: 0.85
  # u-probability sample: keep a record pair when hash(pair) % modulus = 0. With about 37,700 records (about 710M possible
  # pairs) a modulus of 3,500 keeps about 200,000 random pairs, drawn from ALL pairs, not from blocks.
  idr_u_sample_modulus: 3500
  # Version of the counting rules (docs/methodology/CHANGELOG.md); stamped on every scorecard row and snapshot.
  methodology_version: '2.0'
  # Source D linkage: after the email rule, also link by phone when neither side has an email link (ADR-009 reports its measured precision).
  linkage_phone_fallback: true
  # The month a household's engagement effect is dated from, by the term of its first registration (the registration period, not a signup date).
  # Must equal config sources.fan.enroll_month_by_term (a test enforces it).
  # Before/after design windows, in months: the pre period is the 12 months before event time (at least 6 of them with an account), the post period is the
  # 12 months from event time (at least 6 of them inside the data).
  fan_pre_months: 12
  fan_min_pre_months: 6
  fan_post_months: 12
  fan_min_post_months: 6
  enrollment_month_by_term: {SPRING: 3, FALL: 8, ANNUAL: 3}
  # Which matcher feeds the marts: fs (Fellegi-Sunter) or rules (baseline). Both are always computed.
  matcher: fs
  # Countries whose federation reissues Player IDs every year, so the ID cannot link a player across seasons.
  # This is documented source behaviour (docs/source_inventory.md), not ground truth.
  intl_unstable_person_id_countries: ["PA"]
  # INTL sheets whose "Full Name" column gives the family name first (Japan).
  intl_family_name_first_countries: ["JP"]

models:
  counting_flag_football:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    quality:
      +materialized: table
      +schema: quality
    identity:
      +materialized: table
      +schema: identity
      +tags: ['phase2']
    marts:
      +materialized: table
      +schema: marts
      +tags: ['phase2']
    evaluation:
      +materialized: table
      +schema: evaluation
      +tags: ['phase2']
    facts:
      +materialized: table
      +schema: facts
      +tags: ['phase3']
    measurement:
      +materialized: table
      +schema: measurement
      +tags: ['phase3']
    fan:
      +materialized: table
      +schema: fan
      +tags: ['phase4']
    linkage:
      +materialized: table
      +schema: linkage
      +tags: ['phase4']
    retention:
      +materialized: table
      +schema: retention
      +tags: ['phase4']
    phase5:
      +materialized: table
      +schema: phase5
      +tags: ['phase5']
      staging:
        +materialized: view
      consent:
        # household and consent models: restricted zone. Nothing in them reaches a club except through the aggregate funnel (phase5 schema).
        +schema: phase5_restricted
    shares:
      +materialized: table
      +tags: ['phase3']
      exec:
        +schema: share_exec
      analyst:
        +schema: share_analyst
      ops:
        +schema: share_ops
      marketing:
        +schema: share_marketing
      media:
        +schema: share_media

seeds:
  counting_flag_football:
    +schema: reference
