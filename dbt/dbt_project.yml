name: counting_flag_football
version: "0.1.0"
config-version: 2
profile: counting_flag_football

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Age convention (ADR-002): age is computed as of this month-day of the season year.
  age_cutoff_month_day: "12-31"
  # Gmail dot/plus-address folding is OFF: it can merge distinct people (see normalize_email).
  email_fold_gmail: false
  # Name comparison (Jaro-Winkler, 0 to 1). DuckDB scale; Snowflake's JAROWINKLER_SIMILARITY is 0 to 100.
  name_fuzzy_high: 0.92
  name_fuzzy_low: 0.85
  # u-probability sample: keep a record pair when hash(pair) % modulus = 0. With 13,965 records (97.5M possible
  # pairs) a modulus of 488 keeps about 200,000 random pairs, drawn from ALL pairs, not from blocks.
  idr_u_sample_modulus: 488
  # Version of the counting rules (docs/methodology/CHANGELOG.md); stamped on every scorecard row and snapshot.
  methodology_version: '1.0'
  # Which matcher feeds the marts: fs (Fellegi-Sunter) or rules (baseline). Both are always computed.
  matcher: fs
  # Largest cluster that is plausible for one person: 3 seasons x 2 US terms x 2 concurrent leagues = 12,
  # plus 2 for near-duplicate registrations. A bigger cluster fails the build (see tests/idr_clusters_within_plausible_size.sql).
  idr_plausible_max_cluster_size: 14
  # Countries whose federation reissues Player IDs every year, so the ID cannot link a player across seasons.
  # This is documented source behaviour (docs/source_inventory.md), not ground truth.
  intl_unstable_person_id_countries: ["PA"]
  # INTL sheets whose "Full Name" column gives the family name first (Japan).
  intl_family_name_first_countries: ["JP"]

models:
  counting_flag_football:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    quality:
      +materialized: table
      +schema: quality
    identity:
      +materialized: table
      +schema: identity
      +tags: ['phase2']
    marts:
      +materialized: table
      +schema: marts
      +tags: ['phase2']
    evaluation:
      +materialized: table
      +schema: evaluation
      +tags: ['phase2']
    facts:
      +materialized: table
      +schema: facts
      +tags: ['phase3']
    measurement:
      +materialized: table
      +schema: measurement
      +tags: ['phase3']
    shares:
      +materialized: table
      +tags: ['phase3']
      exec:
        +schema: share_exec
      analyst:
        +schema: share_analyst
      ops:
        +schema: share_ops
      marketing:
        +schema: share_marketing
      media:
        +schema: share_media

seeds:
  counting_flag_football:
    +schema: reference
