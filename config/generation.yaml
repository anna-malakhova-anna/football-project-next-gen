# Counting Flag Football: generation config (ALL DATA IS SYNTHETIC)
# Everything the generator needs lives here: seed, sizes, behaviour, defect rates.
# Defect rates are fractions (0.04 = 4%). Keys under `defects` are the stable
# defect ids that dq_summary compares observed rates against (see spec 7.5).

seed: 42

paths:
  raw_dir: data/raw
  ground_truth_dir: data/ground_truth
  warehouse: warehouse/flag.duckdb

seasons:
  # Five participation years. The FIRST is left-censored: history before it is unknown, so nobody in it can be classed
  # new or returning. Models and tests read this through the observation_window seed; no model hardcodes a year.
  first_observed_year: 2021
  years: [2021, 2022, 2023, 2024, 2025]
  us_terms: [SPRING, FALL]      # US has two seasons a year
  # Canada and International use one calendar-year season.

population:
  total_people: 15000
  # Segment shares of the true-person registry. Must sum to 1.0 with `adults_us_ca`
  # taking the remainder. Cross-border movers are a subset of US+CA youth, not a segment.
  segments:
    us_youth: 0.60
    ca_youth: 0.18
    intl: 0.17
    adults_us_ca: 0.05          # remainder
  youth_age_range: [5, 17]
  adult_age_range: [18, 55]
  cross_border_share_of_us_ca: 0.02   # appear in both US and CA sources in different seasons
  cross_border_dual_year_share: 0.5   # of movers: also register in BOTH countries in the year they move
  ca_francophone_share: 0.25          # of CA youth (QC, NB, ON)
  intl_country_shares: {MX: 0.25, GB: 0.20, JP: 0.20, DE: 0.15, AT: 0.10, PA: 0.10}
  youth_female_share: 0.45            # base share of F among youth (before girls' growth trend)
  adult_female_share: 0.50
  us_adult_share_of_adults_us_ca: 0.77
  intl_adult_share: 0.30              # of the intl segment: adult women's and men's players
  household:
    youth_with_sibling_share: 0.30    # of youth, share with >=1 sibling in the data
    max_siblings: 3                   # max minors per household
  twins:
    household_share: 0.005            # of youth households: one pair of twins (same DOB, season, guardian)
  name_change:
    rate: 0.003                       # of INTL adult women: a different family name in a later season
    min_count: 3                      # the rate alone gives under one person at this population size
  nickname_share: 0.15                # people with a nickname (used by the nickname defect)
  consent:
    marketing_opt_in_rate: 0.35
    photo_consent_rate: 0.70
  locales:
    US: en_US
    CA_EN: en_CA
    CA_FR: fr_CA
    MX: es_MX
    GB: en_GB
    JP: ja_JP
    DE: de_DE
    AT: de_DE                         # faker has no de_AT locale in use here; reuse de_DE
    PA: es_MX                         # no es_PA locale; reuse es_MX

markets:
  # SYNTHETIC markets (rework spec, section 2). US markets are groups of ZIP3 prefixes inside a state, Canadian markets are groups of FSAs inside a province, and each
  # international country is one market (its returns carry no postal code). Registrations in a market start only after its launch year; some markets never launch.
  seed_offset: 7
  us_markets_per_state: {TX: 4, CA: 3, FL: 3, NJ: 2, MA: 2, NY: 3, IL: 2, OH: 2, WA: 1, GA: 2, CO: 1, AZ: 1, PA: 1, CT: 1}     # 28 markets
  ca_markets_per_province: {QC: 2, "ON": 3, NB: 1, BC: 2, AB: 2, NS: 1, MB: 1}                                             # 12 markets (ON is quoted: bare ON is a YAML boolean)
  intl_markets: {MX: 1, GB: 1, JP: 1, DE: 1, AT: 1, PA: 1}
  team_market_share: 0.40
  household_population_range: [20000, 120000]      # invented households per market: the denominator for "per 1,000 households"
  launches: {2021: 10, 2022: 8, 2023: 7, 2024: 5, never: 10}      # counts among the 40 US and CA markets
  intl_launch_years: {MX: 2022, GB: 2021, JP: 2023, DE: 2022, AT: 2024, PA: 2023}

participation:
  # Per-season churn probability by age at the season (applies after first season).
  churn_by_age:
    - {min_age: 5,  max_age: 7,  p: 0.25}
    - {min_age: 8,  max_age: 11, p: 0.15}
    - {min_age: 12, max_age: 13, p: 0.25}
    - {min_age: 14, max_age: 17, p: 0.40}
    - {min_age: 18, max_age: 99, p: 0.35}
  # Share of people whose first season is each year (before girls' trend adjustment).
  first_season_weights: {2021: 0.40, 2022: 0.22, 2023: 0.16, 2024: 0.12, 2025: 0.10}
  # Girls' participation grows: multiplier on the weight of F in later first-seasons.
  girls_new_player_multiplier: {2021: 1.0, 2022: 1.15, 2023: 1.3, 2024: 1.5, 2025: 1.7}
  us_two_leagues_same_season_share: 0.05   # legitimate multi-league play, not duplicates
  us_both_terms_given_active: 0.60         # chance an active US player plays Spring and Fall

defects:
  fan:
    email_differs_from_registration: 0.25   # of participant accounts: the account email is not the guardian's registration email; caps the linkage rate on purpose
    duplicate_event: 0.005                  # the same event_id delivered twice
    late_arriving_event: 0.02               # lands in a later month's file; event_ts keeps the true month
    clock_skew: 0.01                        # event_ts shifted by up to +/- 2 days (can cross a month boundary)
    email_case_whitespace: 0.05             # account email typed with capitals / trailing space
    phone_shared_with_participant_household: 0.01   # of non-participant accounts with a phone: reuses a participant household's number (a false link if matched)
    duplicate_account: 0.03                 # the same household has a second account (same email, or same phone and postal prefix)
    refund_without_original: 0.005          # of transactions: a refund whose original_txn_id matches no transaction
    consent_out_of_order: 0.01              # of opt-in/opt-out pairs: the opt-out is timestamped before the opt-in
  us_league:
    name_typo_reregistration: 0.04
    nickname_reregistration: 0.03
    exact_duplicate: 0.015
    near_duplicate: 0.01
    impossible_dob: 0.005
    dob_day_month_swapped: 0.01
    guardian_email_case_whitespace: 0.08
    guardian_email_changed_between_seasons: 0.06
    missing_gender: 0.03
    missing_photo_consent: 0.10
    # Not in the spec's defect list; added so every consent column can be NULL:
    missing_marketing_opt_in: 0.05
    zip_leading_zero_dropped: 0.50      # of zips that start with 0 (NJ, MA, CT)
  ca_club:
    accents_stripped: 0.10
    all_caps_names: 0.05
    postal_code_format: 0.15            # no space or lowercase
    missing_consents_object: 0.07
    pagination_overlap_duplicate: 0.01
    birth_year_off_by_one: 0.015
    # Not in the spec's defect list; added so each consent field can be null:
    null_photo_media: 0.10
    null_casl_marketing: 0.05
  intl_federation:
    uk_dob_excel_serial: 0.20           # of DOBs on the UK sheet
    country_value_inconsistency: 0.25
    # Not in the spec's defect list; added so Media Consent can be blank:
    missing_media_consent: 0.10
  # Structural (not rate-based) intl defects, injected deterministically:
  #   Germany + Austria sheets: title row + blank row above the header
  #   Some sheets: trailing "Total: N" summary row
  #   Japan: family name first
  #   Panama: Player ID reissued each year

  school_aggregates:                    # Source E: school and recreation program headcounts (no individuals)
    total_mismatch: 0.08                # total_count != girls_count + boys_count
    missing_grade_band: 0.05
    duplicate_report: 0.03              # the same program-year reported twice by different reporters
    round_number: 0.10                  # suspiciously round totals (100, 150, 200, 250, 300)

sources:
  ca_club:
    page_size: 200
  intl:
    sheets_with_title_rows: [DE, AT]
    sheets_with_summary_row: [MX, GB, DE, PA]
    family_name_first_sheets: [JP]
    unstable_player_id_sheets: [PA]
    email_present_minor: 0.20           # "often blank for minors"
    email_present_adult: 0.90
  fan:
    # Source D, revised for the fan-acquisition rework: fan accounts, consent events, engagement events and transactions. SYNTHETIC, with a built-in causal
    # structure for evaluation (docs/decisions/ADR-010, ADR-011). Truth goes to ground truth, never into the raw files.
    base_events_per_month: 0.6                  # events per active account-month before fandom, season and uplift
    fandom_sd: 0.6                              # log-scale effect of the latent fandom score on engagement
    # SELECTION: households with higher latent fandom are more likely to enroll a child: P(enroll) = sigmoid(intercept + slope * fandom).
    selection: {intercept: -0.4, slope: 0.9}
    true_uplift: 0.15                           # after a household's first registration, events per month are x (1 + true_uplift) while a child is active
    uplift_decay_half_life_months: 12           # after the last active season ends, the uplift halves every this many months
    enroll_month_by_term: {SPRING: 3, FALL: 8, ANNUAL: 3}   # the month the uplift starts (first registration); the analysis uses the same rule
    seasonality: {1: 1.2, 2: 1.25, 3: 0.85, 4: 0.8, 5: 0.8, 6: 0.8, 7: 0.85, 8: 1.0, 9: 1.35, 10: 1.4, 11: 1.4, 12: 1.35}   # NFL season peak
    event_mix: {app_open: 0.45, content_view: 0.30, game_stream: 0.12, newsletter_click: 0.08, fantasy_activity: 0.05}
    fantasy_season_months: [9, 10, 11, 12, 1]   # fantasy_activity is x3 in these months and x0.5 outside
    flag_content_share_after_registration: 0.5  # share of content views that are flag_content_view for an enrolled, active household (a relabel, not extra volume)
    flag_content_share_background: 0.02         # background share for everyone else
    account:
      existing_at_registration: {intercept: -1.0, slope: 0.9}    # P(a participant household already had a fan account) = sigmoid(intercept + slope * fandom)
      stock_penetration: 0.004                  # share of a market's households with a fan account on the first day of the data
      organic_new_rate_per_household_year: 0.0012   # new accounts per household per year in every market, with the NFL seasonality
      account_fandom_tilt: 0.5                  # accounts are held by fandom-heavy households: fandom of an account holder ~ N(tilt, 1)
      stock_created_years_before_window: 3      # accounts that already exist when the data starts (the opening stock, and a participant household's existing account) were opened this long before
      phone_present: 0.60                       # share of accounts that carry a phone
      phone_matches_when_email_differs: 0.30    # when the account email differs from the guardian's, the phone still matches this often
      acquisition_source_mix: {organic: 0.50, ticketing: 0.20, app_store: 0.20, partner_referral: 0.10}
      holder_birth_year: [1958, 2000]           # adults only
    acquisition:
      true_acquisition_lift: 0.20               # extra probability that a household with no account creates one within a year of its first registration
      organic_account_prob_12m: 0.04            # the baseline probability of the same, scaled by exp(tilt * fandom)
      months_to_account: [0, 11]                # when, after the first registration, a net-new account is created
      flag_prompt_share_of_induced: 0.60        # share of program-induced accounts that come through the flag registration prompt
      flag_prompt_share_of_organic: 0.08        # share of organic net-new accounts that do
    lapse:
      base_monthly_hazard: 0.008                # per active account-month
      fandom_slope: -0.3                        # hazard x exp(slope * fandom): fans lapse less
      after_child_churn_multiplier: 1.5         # hazard x this once the household's last child season has ended (an association the data can show)
      reactivation_base: 0.05                   # probability a lapsed participant account reactivates within 12 months of the first registration, anyway
      reactivation_lift: 0.30                   # extra probability caused by registering (the reactivation truth)
    transactions:
      ticket: {rate: 0.020, uplift_non_team: 0.10, uplift_team: 0.30, team_multiplier: 1.6, amount: [40, 180]}
      merch: {rate: 0.025, uplift: 0.15, amount: [15, 90]}
      subscription: {share_of_accounts: 0.12, amount: 10.0, uplift_share: 0.05}     # a flat monthly amount while subscribed
      other: {rate: 0.010, amount: [5, 40]}
      refund_share: 0.03                        # of ticket and merch transactions
      refund_delay_days: [1, 10]
    consent:
      # P(opt_in) / P(explicit opt_out) per channel at each capture point; the rest is "not captured": no event at all (NULL, never FALSE)
      opt_in: {signup: {email: 0.45, sms: 0.15, push: 0.40}, checkout: {email: 0.60, sms: 0.20, push: 0.10}, flag_registration: {email: 0.70, sms: 0.30, push: 0.35}}
      explicit_opt_out_given_declined: 0.30
      preference_center_monthly_opt_in: 0.003   # per account-month, per channel not currently opted in
      opt_out_base_monthly: 0.004               # per opted-in email account-month
      opt_out_per_event: 0.002                  # extra opt-out hazard per engagement event that month (a stand-in for email volume)
  school:
    programs_per_100_youth_participants: 3.0     # programs are placed where registered youth live, so overlap is possible
    program_participation_rate: 0.92             # chance a stable program reports in a given year
    overlap_share_of_participants: 0.15          # share of registered youth who are also in a school or rec program that year
    max_overlap_share_of_program: 0.35           # an overlapping kid never makes up more than this share of a program
    program_types: {PE_UNIT: 0.50, INTRAMURAL: 0.25, AFTER_SCHOOL: 0.25}
    size_range: {PE_UNIT: [80, 400], INTRAMURAL: [30, 120], AFTER_SCHOOL: [15, 60]}
    girls_share: {PE_UNIT: 0.49, INTRAMURAL: 0.42, AFTER_SCHOOL: 0.45}
    round_values: [100, 150, 200, 250, 300]
    grade_bands: {K-2: [5, 7], 3-5: [8, 10], 6-8: [11, 13], 9-12: [14, 17]}   # ages at December 31

# ---------------------------------------------------------------------------------------------------------------------------------------------------------
# Phase 5: six US registration feeds with different schemas and defects (data quality under privacy constraints). SYNTHETIC. Isolated scope: the feeds are
# derived from the existing true US youth registry with their own random stream (seed + seed_offset), so no Phase 1-4 file or number changes.
# The feed names and shapes follow the public landscape only loosely; everything about internal NFL/RCX or vendor systems is an ASSUMPTION.
# ---------------------------------------------------------------------------------------------------------------------------------------------------------
phase5:
  seed_offset: 500
  seasons: [2024, 2025]                  # the latest season in the window is 2025 (the Phase 1-4 window is not extended)
  season_start: {SPRING: "03-01", FALL: "09-01"}
  feed_weights: {matrix_export: 0.35, vendor_reg_a: 0.22, vendor_reg_b: 0.13, pop_warner_feed: 0.12, pal_chapter_csv: 0.10, school_program: 0.08}
  second_feed_share: 0.10                # of children: also registered through a second feed in the same season (the cross-source duplicate)
  leagues_per_state: {matrix_export: 2, vendor_reg_a: 1, vendor_reg_b: 1, pop_warner_feed: 1, pal_chapter_csv: 1, school_program: 1}
  stale_league_share: 0.08               # of leagues: they stopped submitting after 2024 (timeliness)
  two_parent_email_household_share: 0.08 # of households: some rows use a second parent's email
  email_case_whitespace: 0.05           # of rows, every feed: parent email typed with capitals or spaces
  late_submission: 0.07                  # of rows with a timestamp: registered well after the season started
  alias_map_coverage: 0.85               # of vendor_reg_a free-text league spellings that the (steward-maintained) alias map covers
  pop_warner_tackle_share: 0.35          # extra tackle rows per flag row in the Pop Warner feed (out of scope; must be filtered)
  pop_warner_two_league_association_share: 0.25   # associations that run two flag leagues (association is not league)
  defects:
    matrix_export:
      missing_zip: 0.06
      zip_plus4: 0.08
      missing_consent_ts: 0.05
      missing_consent_version: 0.04
      no_consent_record: 0.03
      name_variant: 0.03
    vendor_reg_a:
      impossible_dob: 0.01
      invalid_zip: 0.04
      missing_zip: 0.05
      missing_tos_ts: 0.08
      no_consent_record: 0.04
      name_variant: 0.05
    vendor_reg_b:
      missing_age_group: 0.03
      invalid_zip: 0.04
      missing_zip: 0.05
      no_consent_record: 0.06
      name_variant: 0.04
    pop_warner_feed:
      missing_zip: 0.08
      blank_flag_league_code: 0.30       # of rows of two-league associations
      no_consent_record: 0.05
      name_variant: 0.03
    pal_chapter_csv:
      duplicate_row: 0.04
      typo_name: 0.06
      typo_email: 0.04
      missing_zip: 0.10
      short_year_dob: 0.20
      no_consent_record: 0.12
    school_program:
      missing_grade: 0.05
      name_variant: 0.06
  # Scorecard parameters (dbt reads them through the p5_params seed, exported by generator/phase5/export_seed.py; no model hard-codes them).
  dq:
    youth_min_age: 4                     # age at Dec 31 of the season year below which a DOB is implausible for a youth league
    youth_max_age: 17
    late_days: 14                        # a record registered more than this many days after the season start is late
    min_records_for_grade: 25            # a league or market with fewer scored records gets no grade
    grade_a: 0.95                        # overall score (mean of the dimension scores) at or above which the grade is A, B, C; below grade_c is D
    grade_b: 0.85
    grade_c: 0.70
