# Retrofitted data contract: international federation returns (Source C). Synthetic data.
source_system: INTL_FED
version: 1.0.0
effective_date: 2026-10-01
owner_role: "Federation Relations, International"
partner_type: "national federations reporting to an international body"
delivery:
  format: XLSX
  mechanism: "one workbook per season, one sheet per country (data/raw/intl/federation_returns_<year>.xlsx)"
  cadence: "annual return per federation"
grain: "one row per registered player per season"
raw:
  table: raw.intl_federation_returns
  # raw rows are positional (c1..c9) and include title, blank, header and summary rows; data rows have a Full Name and are not the header
  row_filter: "c2 is not null and trim(c1) <> 'Player ID'"
primary_key: [_source_file, c1]
person_identifier:
  quality: partial
  field: "c1 (Player ID)"
  note: "federation-local and stable across years, except Spain, which reissues it every year; a changed family name also brings a new ID."
minors_present: true
consent_fields:
  - column: c9
    permits: "media use of the participant (Media Consent). No marketing consent is captured by this source."
    allowed_values: ["Yes", "No", ""]
schema:
  - {column: Player ID, raw: c1, type: string, required: true, pii: direct, pattern: '^[A-Z]{3}-\d{2}-\d{4}$'}
  - {column: Full Name, raw: c2, type: string, required: true, pii: direct}
  - {column: Date of Birth, raw: c3, type: date, required: true, pii: quasi, pattern: '^(\d{2}/\d{2}/\d{4}|\d{5})$'}
  - {column: Gender, raw: c4, type: string, required: true, pii: quasi, allowed_values: [W, M, F, Mujer, Hombre]}
  - {column: Category, raw: c5, type: string, required: true, pii: none}
  - {column: Club, raw: c6, type: string, required: true, pii: quasi}
  - {column: Country, raw: c7, type: string, required: true, pii: none}
  - {column: Email, raw: c8, type: string, required: false, pii: direct}
  - {column: Media Consent, raw: c9, type: boolean, required: false, pii: none, allowed_values: ["Yes", "No", ""]}
quality:
  - {rule: max_null_rate, column: Date of Birth, threshold: 0.05}
  - {rule: max_duplicate_rate, key: [_source_file, c1], threshold: 0.0}
  - {rule: max_nonmatching_rate, column: Player ID, pattern: '^[A-Z]{3}-\d{2}-\d{4}$', threshold: 0.0}
  - {rule: max_nonmatching_rate, column: Date of Birth, pattern: '^(\d{2}/\d{2}/\d{4}|\d{5})$', threshold: 0.01}
  - {rule: max_invalid_rate, column: Gender, allowed_values: [W, M, F, Mujer, Hombre], threshold: 0.0}
  # federations are held to one Country spelling (the ISO alpha-3 code): a known upstream defect
  - {rule: max_invalid_rate, column: Country, allowed_values: [MEX, GBR, JPN, DEU, AUT, ESP], threshold: 0.10}
