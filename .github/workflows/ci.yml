# Build and test the results site and check that the committed public/ is current. Render (not CI) deploys public/. Everything runs from an empty checkout: nothing is cached except the uv environment.
# `make all-phases` is the supported full build: generate, load, validate contracts, every dbt model and test, pytest, and the build checks
# (ground-truth isolation, aggregate lineage, share policy, participant-ID stability). It also runs the Phase 5 experiments with the reduced minimization set (V0, V2, V4). Measured locally (see ADR-013 addendum); a hosted runner is slower, so the job allows 25.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies and create the dbt profile
        run: make setup

      - name: Full build (generate, load, contracts, dbt run and test, pytest, isolation, lineage, share policy, ID stability)
        run: make all-phases

      - name: Build the results site
        run: make site

      - name: The committed public/ must match the code
        # Render serves the committed public/. A stale copy fails here. Only the footer's build date is ignored: it
        # comes from the last commit's time, which is later than the commit that built public/.
        run: |
          make public
          git diff -I 'built 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]' public/ > public-drift.diff
          if [ -s public-drift.diff ]; then git diff --stat -I 'built 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]' public/; echo "public/ differs from the commit: download the public-drift artifact"; exit 1; fi

      - name: Keep the rebuilt public/ and the diff when the check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-drift
          path: |
            public/
            public-drift.diff
