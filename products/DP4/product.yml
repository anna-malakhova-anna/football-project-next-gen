# DP4 product spec (Phase 6): the product's machine-readable label. Validated by scripts/validate_products.py and rendered on the Data product tab.
# Synthetic project; every role is fictional. quality_indicator is read from the scorecards at build time, never typed.
id: DP4
input_sources:
- US_LEAGUE
name: US Flag Growth & Club Market Insights
version: 1.1.0
type: insights
status: mvp
description: How many people play flag football in each US club market, how fit the data is for each use, which leagues have sent no data, and why families are not
  reached. Markets are a project approximation, not any club's territory, and no cell under the small-cell size is shown.
goals:
- G2
value_proposition: driver
consumers:
- role: Club youth and community manager
  use_case: See participation and data gaps in my market
- role: NFL FLAG domestic operations lead
  use_case: Tell growth from better reporting, and find struggling leagues
owner_role: Data Product Manager, NFL FLAG Insights (fictional)
steward_role: Data steward, domestic registrations (fictional)
support_contact: 'issues: <repo>/issues (label: dp4)'
output_ports:
- name: club_market_view
  model: share_club__market_year
  audience: club
  grain: club market x year
  refresh: per season close
- name: market_missingness
  model: share_club__market_missingness
  audience: club
  grain: club market x year
  refresh: per season close
- name: league_scorecard
  model: share_ops__league_scorecard
  audience: ops
  grain: league x season x purpose
  refresh: per season close
input_products:
- DP1
- DP2
- DP5
sources_lineage:
  share_club__market_year: dbt/models/shares/club/share_club__market_year.sql
  share_club__market_missingness: dbt/models/shares/club/share_club__market_missingness.sql
  share_ops__league_scorecard: dbt/models/shares/ops/share_ops__league_scorecard.sql
quality_indicator:
  from_model: dq_scorecard_market
  purpose: GEO
  aggregate: grade_distribution
metrics:
- participants_allocated
- orgs_known
- orgs_reporting
- orgs_dark
- girls_share_known_only
- girls_share_bound_low
- girls_share_bound_high
classification: aggregate, no direct or quasi identifier, no organization id
privacy:
  min_cell_size: from privacy_params.k_min
  age_rules: dbt/seeds/age_consent_rules.csv
  prohibited_uses:
  - use: individual targeting
    enforced_by:
    - kind: dbt_test
      name: share_club_obeys_suppression_rules
    - kind: dbt_test
      name: p5_activation_chain_never_touches_the_child
    - kind: dbt_test
      name: activation_counts_only_guardian_consented_households
    - kind: script
      name: check_share_policy
  - use: re-identification
    enforced_by:
    - kind: dbt_test
      name: share_club_obeys_suppression_rules
    - kind: dbt_test
      name: share_exec_obeys_suppression_rules
    - kind: dbt_test
      name: share_analyst_k_anonymity_warning
    - kind: script
      name: check_share_policy
  - use: child-level marketing
    enforced_by:
    - kind: dbt_test
      name: consent_permissions_never_grant_from_a_blank
    - kind: dbt_test
      name: activation_counts_only_guardian_consented_households
    - kind: dbt_test
      name: share_marketing_only_consented_contacts
    - kind: dbt_test
      name: marts_consent_never_derived_from_null
terms_of_use: docs/product/terms/DP4.md
geographic_coverage: US club markets (a project approximation of contiguous ZIP3 groups, ADR-016)
tags:
- participation
- clubs
- data-quality
- domestic
recommended_products:
- DP1
- DP5
feedback: https://github.com/anna-malakhova-anna/football-project-next-gen/issues/new?template=data-product-feedback.md
shelf_life: long-term (reviewed annually)
decommission_plan: docs/product/decommission-example.md
pricing: Internal. No chargeback. Cost tracked as warehouse compute (mart_product_health).
health_metrics:
- quality
- freshness
- contract_status
- pipeline
- trust
- privacy
- cost

# --- Where this product is formed (Phase 6 addendum, section 1).
internal_models:
- mart_retention_cohorts
- mart_retention_survival
- retention_spells
- mart_market_coverage
- dq_rule_results
- dq_scorecard_source
- dq_scorecard_org
- dq_scorecard_market
- dq_trend
- dq_fix_ranking
- dq_market_rule_results
- mart_dq_impact
gate: DP2's ports and DP1's aggregate port (the market and league scorecards)
share_models:
- share_ops__league_scorecard
- share_club__market_year
- share_club__market_missingness
- share_club__chart_insights
- share_exec__market_quadrants
- share_exec__retention_*
aggregate_ports:
- mart_market_coverage
- dq_scorecard_source
- dq_scorecard_org
- dq_scorecard_market
- dq_trend
- dq_fix_ranking
- mart_dq_impact
- mart_retention_survival
