# DP6 product spec (Phase 7): the product's machine-readable label. Validated by scripts/validate_products.py. DRAFT: scores, targets and copy wait for Anna.
# Synthetic project; every role is fictional. quality_indicator is read from the scorecards at build time, never typed.
id: DP6
input_sources:
- INTL_FED
- CA_CLUB
- GMP_PROXY
name: Global Markets Outlook
version: 0.2.0
type: insights
status: proposed
description: Where flag football is growing in the NFL Global Markets Program's 22 markets, where we cannot tell, and why. Every market has a status (measured,
  partial, proxy-only, dark) and a direction read like for like against the noise floor; markets with no data get a labelled planning scenario, never a count.
goals:
- G1
value_proposition: enabler
consumers:
- role: Executive
  use_case: See which program markets can be read, which cannot, and what it would take to read them
- role: International growth lead
  use_case: Decide which markets to onboard next
- role: Federation data lead (partner)
  use_case: See its own report card and which fixes move its market's status
owner_role: Data Product Manager, NFL FLAG Insights (fictional)
steward_role: Data steward, federation returns and club proxy returns (fictional)
support_contact: 'issues: <repo>/issues (label: dp6)'
output_ports:
- name: global_eu_uk_markets
  model: share_exec__gmp_markets_eu_uk
  audience: exec
  grain: program market (latest season), UK, EU and Switzerland
  refresh: per season close
  regime_note: "EU GDPR, UK GDPR and the Swiss FADP assumed; questions for the privacy lead: the age of digital consent per EU country (13 to 16), and whether record-level federation returns may leave each country (unverified assumption, not a legal finding)"
- name: global_eu_uk_quality_trend
  model: share_exec__gmp_quality_trend_eu_uk
  audience: exec
  grain: program market with a participation source x season, UK, EU and Switzerland
  refresh: per season close
  regime_note: "EU GDPR, UK GDPR and the Swiss FADP assumed; questions for the privacy lead: the age of digital consent per EU country (13 to 16), and whether record-level federation returns may leave each country (unverified assumption, not a legal finding)"
- name: global_eu_uk_scenario
  model: share_exec__gmp_scenario_eu_uk
  audience: exec
  grain: program market with no participation source (latest season), UK, EU and Switzerland
  refresh: per season close
  regime_note: "EU GDPR, UK GDPR and the Swiss FADP assumed; questions for the privacy lead: the age of digital consent per EU country (13 to 16), and whether record-level federation returns may leave each country (unverified assumption, not a legal finding)"
- name: global_canada_markets
  model: share_exec__gmp_markets_canada
  audience: exec
  grain: program market (latest season), Canada
  refresh: per season close
  regime_note: "PIPEDA assumed, with Quebec Law 25 for Quebec residents; question for the privacy lead: whether Quebec club records need a separate consent basis (unverified assumption, not a legal finding)"
- name: global_canada_quality_trend
  model: share_exec__gmp_quality_trend_canada
  audience: exec
  grain: program market with a participation source x season, Canada
  refresh: per season close
  regime_note: "PIPEDA assumed, with Quebec Law 25 for Quebec residents; question for the privacy lead: whether Quebec club records need a separate consent basis (unverified assumption, not a legal finding)"
- name: global_other_markets
  model: share_exec__gmp_markets_other
  audience: exec
  grain: program market (latest season), the other 12 markets
  refresh: per season close
  regime_note: "one regime per market assumed (for example Brazil LGPD, Japan APPI, China PIPL); question for the privacy lead: which of these markets can send only aggregate returns (unverified assumption, not a legal finding)"
- name: global_other_quality_trend
  model: share_exec__gmp_quality_trend_other
  audience: exec
  grain: program market with a participation source x season, the other 12 markets
  refresh: per season close
  regime_note: "one regime per market assumed (for example Brazil LGPD, Japan APPI, China PIPL); question for the privacy lead: which of these markets can send only aggregate returns (unverified assumption, not a legal finding)"
- name: global_other_scenario
  model: share_exec__gmp_scenario_other
  audience: exec
  grain: program market with no participation source (latest season), the other 12 markets
  refresh: per season close
  regime_note: "one regime per market assumed (for example Brazil LGPD, Japan APPI, China PIPL); question for the privacy lead: which of these markets can send only aggregate returns (unverified assumption, not a legal finding)"
- name: global_priorities
  model: share_exec__gmp_board
  audience: exec
  grain: "program market (latest season), every regime: a planning view"
  refresh: per season close
- name: global_walkthroughs
  model: share_exec__gmp_walkthrough
  audience: exec
  grain: market x playbook stage (Canada and Italy)
  refresh: when a stage changes
- name: federation_report_card
  model: share_partner__federation_report_card
  audience: partner
  grain: federation x top-three fix (latest season)
  refresh: per season close
input_products:
- DP3
- DP4
sources_lineage:
  share_exec__gmp_markets_eu_uk: dbt/models/shares/exec/share_exec__gmp_markets_eu_uk.sql
  share_exec__gmp_quality_trend_eu_uk: dbt/models/shares/exec/share_exec__gmp_quality_trend_eu_uk.sql
  share_exec__gmp_scenario_eu_uk: dbt/models/shares/exec/share_exec__gmp_scenario_eu_uk.sql
  share_exec__gmp_markets_canada: dbt/models/shares/exec/share_exec__gmp_markets_canada.sql
  share_exec__gmp_quality_trend_canada: dbt/models/shares/exec/share_exec__gmp_quality_trend_canada.sql
  share_exec__gmp_markets_other: dbt/models/shares/exec/share_exec__gmp_markets_other.sql
  share_exec__gmp_quality_trend_other: dbt/models/shares/exec/share_exec__gmp_quality_trend_other.sql
  share_exec__gmp_scenario_other: dbt/models/shares/exec/share_exec__gmp_scenario_other.sql
  share_exec__gmp_board: dbt/models/shares/exec/share_exec__gmp_board.sql
  share_exec__gmp_walkthrough: dbt/models/shares/exec/share_exec__gmp_walkthrough.sql
  share_partner__federation_report_card: dbt/models/shares/partner/share_partner__federation_report_card.sql
quality_indicator:
  from_model: dq_scorecard_source
  purpose: COUNT
  filter:
    source_system: INTL_FED
  aggregate: grade
metrics: []
classification: aggregate per market, no count of people on the market view; small-cell growth hidden; no direct or quasi identifier of a participant
privacy:
  min_cell_size: from privacy_params.k_min
  age_rules: dbt/seeds/age_consent_rules.csv
  prohibited_uses:
  - use: publishing a planning scenario as a measurement, or beside measured values
    enforced_by:
    - kind: dbt_test
      name: gmp_every_market_has_one_status_and_scenarios_only_where_unmeasured
    - kind: script
      name: check_share_policy
  - use: grading or tuning the scenario against the answer key outside evaluation
    enforced_by:
    - kind: script
      name: check_eval_isolation
  - use: counting club proxy returns as players
    enforced_by:
    - kind: script
      name: check_lineage
terms_of_use: docs/product/terms/DP6.md
geographic_coverage: the 22 markets of the NFL Global Markets Program (public page, read 2026-10-25); flag football only
tags:
- global
- markets
- uncertainty
- exec
recommended_products:
- DP3
- DP4
feedback: https://github.com/anna-malakhova-anna/football-project-next-gen/issues/new?template=data-product-feedback.md
shelf_life: medium-term (reviewed each season; status and direction recomputed at season close)
decommission_plan: docs/product/decommission-example.md
pricing: Internal. No chargeback.
health_metrics:
- quality
- freshness
- contract_status
- pipeline
- trust
- privacy
- cost

# --- Where this product is formed (Phase 6 addendum, section 1). Exec ports are split by the assumed legal regime (spec D10): one macro per kind
# (dbt/macros/gmp_shares.sql) writes every regime's model; gmp_regime_ports_partition_the_markets checks nothing is lost or doubled.
internal_models:
- stg_gmp_proxy
- stg_gmp_minimum_return
- mart_gmp_*
gate: DP3's participation ports and DP4's country scorecard; the GMP_PROXY contract
share_models:
- share_exec__gmp_*
- share_partner__federation_report_card
aggregate_ports: []
