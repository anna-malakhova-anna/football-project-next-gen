# DP2 product spec (Phase 6): the product's machine-readable label. Validated by scripts/validate_products.py and rendered on the Data product tab.
# Synthetic project; every role is fictional. quality_indicator is read from the scorecards at build time, never typed.
id: DP2
input_sources:
- US_LEAGUE
- CA_CLUB
- INTL_FED
name: Flag Participant & Household Master
version: 0.9.0
type: master
status: proposed
description: 'One reliable person and one household behind many registrations, with every link carrying its reason and a review queue for uncertain cases. Internal
  and restricted: it holds names, birth dates and contact details, and marketing never reads it.'
goals:
- G1
- G2
- G3
value_proposition: enabler
consumers:
- role: Operations and data stewards
  use_case: Resolve duplicates and review uncertain matches
owner_role: Data Product Manager, NFL FLAG Insights (fictional)
steward_role: Data steward, identity (fictional)
support_contact: 'issues: <repo>/issues (label: dp2)'
output_ports:
- name: participant
  model: share_ops__participant
  audience: ops
  grain: participant
  refresh: per season close
- name: registration
  model: share_ops__registration
  audience: ops
  grain: registration
  refresh: per season close
- name: review_queue
  model: share_ops__review_queue
  audience: ops
  grain: uncertain pair
  refresh: per build
input_products:
- DP1
sources_lineage:
  share_ops__participant: dbt/models/shares/ops/share_ops__participant.sql
  share_ops__registration: dbt/models/shares/ops/share_ops__registration.sql
  share_ops__review_queue: dbt/models/shares/ops/share_ops__review_queue.sql
quality_indicator:
  from_model: mart_uncertainty_decomposition
  component: IDENTITY
  aggregate: identity_range_pct
metrics:
- identity_participants_low
- identity_participants_point
- identity_participants_high
classification: 'restricted: direct identifiers (ops audience only)'
privacy:
  min_cell_size: not applicable (row-level, ops audience)
  age_rules: dbt/seeds/age_consent_rules.csv
  prohibited_uses:
  - use: marketing access to the master
    enforced_by:
    - kind: dbt_test
      name: share_marketing_only_consented_contacts
    - kind: script
      name: check_share_policy
  - use: fuzzy household linkage
    enforced_by:
    - kind: dbt_test
      name: linkage_is_one_to_one_and_explained
    - kind: dbt_test
      name: idr_twin_guard_holds
terms_of_use: docs/product/terms/DP2.md
geographic_coverage: all onboarded sources
tags:
- identity
- households
- restricted
- master
recommended_products:
- DP1
- DP3
- DP4
- DP5
feedback: https://github.com/anna-malakhova-anna/football-project-next-gen/issues/new?template=data-product-feedback.md
shelf_life: long-term (rules reviewed when matching accuracy changes)
decommission_plan: docs/product/decommission-example.md
pricing: Internal. No chargeback.
health_metrics:
- quality
- pipeline
- trust
- privacy
- cost

# --- Where this product is formed (Phase 6 addendum, section 1).
internal_models:
- idr_*
- dim_participant
- bridge_registration_participant
- participant_identifiers
- fct_participant_year
- fct_participant_us_season
- fct_registration
- fct_reported_headcount
- p5_blocking_keys
- p5_candidate_pairs
- p5_clusters
- p5_clusters_probable
- p5_idr_input_records
- p5_pair_scores
- p5_record_quality
- p5_child
- p5_consent_event
- p5_household
- p5_household_child
- p5_record_person
- int_household
- int_household_profile
- int_household_guarded_contacts
- int_consent_event
- int_household_year_consent
- int_participant_year_market
- mart_retention_vs_deletion
- mart_identity_uncertainty
- mart_reidentification_risk
gate: DP1's restricted port (int_registrations_unioned)
share_models:
- share_ops__participant
- share_ops__registration
- share_ops__review_queue
- share_marketing__*
- share_media__*
- share_privacy__retention_vs_deletion
restricted_ports:
- model: p5_record_quality
  consumers: [DP1]
- model: fct_reported_headcount
  consumers: [DP3]
- model: p5_household
  consumers: [DP5]
- model: p5_household_child
  consumers: [DP5]
- model: p5_consent_event
  consumers: [DP5]
- model: p5_record_person
  consumers: [DP5]
- model: dim_participant
  consumers: [DP3, DP4, DP5]
- model: bridge_registration_participant
  consumers: [DP3, DP4, DP5]
- model: fct_participant_year
  consumers: [DP3, DP4, DP5]
- model: fct_participant_us_season
  consumers: [DP3, DP4, DP5]
- model: fct_registration
  consumers: [DP3, DP4, DP5]
- model: int_household
  consumers: [DP5]
- model: int_household_profile
  consumers: [DP5]
- model: int_consent_event
  consumers: [DP5]
- model: int_household_year_consent
  consumers: [DP5, shared_reference]  # shared_reference: share_exec__roadmap_gates reads counts only
- model: int_participant_year_market
  consumers: [DP4, DP5]
aggregate_ports:
- mart_identity_uncertainty
- mart_reidentification_risk
